/* ---------------- 이미지 넣기 ---------------- */
async function progressImageFile(file, target) {
  if (!file) return;
  if (!/^image\//.test(file.type) && !/\.(png|jpe?g|webp|svg)$/i.test(file.name)) {
    toast('이미지 파일만 넣을 수 있습니다.', true);
    return;
  }
  if (target === 'bg') {
    const src = await readDataURL(file);
    if (!src) { toast('이미지를 읽지 못했습니다.', true); return; }
    const bg = curSlide().bg;
    bg.type = 'image'; bg.src = src;
    imgCache.delete(src);
    pushHistory(); renderStage(); renderThumbsSoon(); renderProps();
    toast('배경으로 넣었습니다. 오버레이로 글자 대비를 조절하세요.');
    return;
  }
  await insertImageFile(file);
}

async function shrinkDataUrl(src, maxSide, quality) {
  try {
    const im = await getImage(src);
    if (!im) return src;
    const W = im.naturalWidth || 0, H = im.naturalHeight || 0;
    if (!W || !H) return src;
    const limit = maxSide || 1600;
    if (src.length < 900000 && Math.max(W, H) <= limit) return src;
    const sc = Math.min(1, limit / Math.max(W, H));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(W * sc));
    cv.height = Math.max(1, Math.round(H * sc));
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(im, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', quality || 0.9);
  } catch (e) { return src; }
}

async function applyAiImage(src) {
  const a = state.ai, f = fmt();
  const small = await shrinkDataUrl(src, 1600, 0.9);
  if (a.target === 'bg') {
    const bg = curSlide().bg;
    bg.type = 'image'; bg.src = small;
    imgCache.delete(small);
    pushHistory(); renderStage(); renderThumbsSoon(); renderProps();
    return;
  }
  const im = await getImage(small);
  const boxW = f.w * .72, boxH = f.h * .64;
  const ar = im && im.naturalWidth ? im.naturalWidth / im.naturalHeight : boxW / boxH;
  let w = boxW, h = boxW / ar;
  if (h > boxH) { h = boxH; w = boxH * ar; }
  w = Math.round(w); h = Math.round(h);
  const el = imageEl({
    src: small, w, h,
    x: Math.round(f.w * .26 + (boxW - w) / 2),
    y: Math.round(f.h * .08 + (boxH - h) / 2)
  });
  curSlide().els.push(el);
  state.selId = el.id;
  pushHistory(); renderStage(); renderThumbsSoon(); renderProps();
}

/* ---------------- API 호출 ---------------- */
async function apiFetch(url, opts, ms) {
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), ms || 180000) : 0;
  try {
    return await fetch(url, Object.assign({}, opts, ctrl ? { signal: ctrl.signal } : {}));
  } catch (e) {
    if (e && e.name === 'AbortError') throw new Error('응답이 없습니다(시간 초과). 잠시 뒤 다시 시도해 주세요.');
    const ne = new Error('요청이 브라우저에서 차단되었습니다. 네트워크·CORS 설정을 확인해 주세요.');
    ne.code = 'NETWORK';
    throw ne;
  } finally {
    if (timer) clearTimeout(timer);
  }
}
async function apiErr(res, name) {
  let msg = '';
  try {
    const j = await res.json();
    msg = (j && j.error && (j.error.message || j.error.status)) || (j && j.message) || '';
  } catch (e) { /* 본문 없음 */ }
  if (!msg) { try { msg = (await res.text()).slice(0, 180); } catch (e2) {} }
  const code = res.status;
  if (code === 401 || code === 403) return name + ' 키가 올바르지 않거나 권한이 없습니다.' + (msg ? ' (' + msg + ')' : '');
  if (code === 429) return name + ' 사용 한도·결제 설정을 확인해 주세요.' + (msg ? ' (' + msg + ')' : '');
  return name + ' 오류 ' + code + (msg ? ': ' + msg : '');
}
async function urlToDataUrl(url) {
  try {
    const res = await apiFetch(url, { mode: 'cors' }, 60000);
    if (!res.ok) throw new Error('status ' + res.status);
    const blob = await res.blob();
    return await new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result || ''));
      fr.onerror = () => reject(new Error('read fail'));
      fr.readAsDataURL(blob);
    });
  } catch (e) {
    throw new Error('이미지 주소를 읽지 못했습니다. 모델을 gpt-image-1로 바꿔 다시 시도해 주세요.');
  }
}
function aiSizeFor(f, model) {
  if (/^dall-e/i.test(model || '')) return f.key === '1:1' ? '1024x1024' : '1024x1792';
  return f.key === '1:1' ? '1024x1024' : '1024x1536';
}
async function genOpenAI(key, prompt, model) {
  model = model || 'gpt-image-1';
  const body = { model: model, prompt: prompt, n: 1, size: aiSizeFor(fmt(), model) };
  if (/^dall-e/i.test(model)) { body.quality = 'standard'; body.response_format = 'b64_json'; }
  const res = await apiFetch('https://api.openai.com/v1/images/generations', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await apiErr(res, 'OpenAI'));
  const j = await res.json();
  const d = (j && j.data && j.data[0]) || {};
  if (d.b64_json) return 'data:image/png;base64,' + d.b64_json;
  if (d.url) return await urlToDataUrl(d.url);
  if (j && j.error && j.error.message) throw new Error('OpenAI: ' + j.error.message);
  throw new Error('OpenAI 응답에 이미지가 없습니다.');
}
function gAspect(f) {
  return f.key === '1:1' ? '1:1' : f.key === '9:16' ? '9:16' : '4:5';
}
async function genGemini(key, prompt, model) {
  model = model || 'gemini-2.5-flash-image';
  const base = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model);
  const k = encodeURIComponent(key);
  if (/imagen/i.test(model)) {
    const res = await apiFetch(base + ':predict?key=' + k, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ instances: [{ prompt: prompt }], parameters: { sampleCount: 1, aspectRatio: gAspect(fmt()) } })
    });
    if (!res.ok) throw new Error(await apiErr(res, 'Gemini'));
    const j = await res.json();
    const p = (j && j.predictions && j.predictions[0]) || {};
    const b64 = p.bytesBase64Encoded || (p.image && p.image.imageBytes);
    if (b64) return 'data:image/png;base64,' + b64;
    throw new Error('Gemini 응답에 이미지가 없습니다.');
  }
  const res = await apiFetch(base + ':generateContent?key=' + k, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { responseModalities: ['IMAGE'], imageConfig: { aspectRatio: gAspect(fmt()) } }
    })
  });
  if (!res.ok) throw new Error(await apiErr(res, 'Gemini'));
  const j = await res.json();
  const parts = (((j.candidates || [])[0] || {}).content || {}).parts || [];
  const withImg = parts.find(p => p && (p.inlineData || p.inline_data));
  if (!withImg) {
    const txt = parts.map(p => p && p.text).filter(Boolean).join(' ').trim();
    if (j && j.promptFeedback && j.promptFeedback.blockReason) throw new Error('요청이 차단되었습니다(' + j.promptFeedback.blockReason + '). 문구를 바꿔 보세요.');
    throw new Error('이미지가 만들어지지 않았습니다.' + (txt ? ' 모델 응답: ' + txt.slice(0, 140) : ''));
  }
  const d = withImg.inlineData || withImg.inline_data;
  return 'data:' + (d.mimeType || d.mime_type || 'image/png') + ';base64,' + d.data;
}
async function aiGenerate() {
  const a = state.ai;
  const keyInput = document.getElementById('aiKey');
  const key = ((keyInput && keyInput.value) || '').trim() || aiKeyGet(a.provider);
  if (!key) {
    aiStatusSet('API 키가 비어 있습니다. 무료로 쓰려면 위 프롬프트를 복사해 외부 도구에서 만든 뒤 2번 칸으로 올리세요.', 'err');
    if (keyInput) keyInput.focus();
    return;
  }
  const modelInput = document.getElementById('aiModel');
  const model = ((modelInput && modelInput.value) || '').trim() || AI_PROVIDERS[a.provider].models[0];
  const prompt = aiPromptText();
  busy(true, 'AI가 이미지를 만드는 중…');
  aiStatusSet('생성 중… 보통 10~40초 걸립니다.');
  try {
    const src = a.provider === 'openai'
      ? await genOpenAI(key, prompt, model)
      : await genGemini(key, prompt, model);
    busy(false);
    await applyAiImage(src);
    aiStatusSet('이미지를 만들어 ' + (a.target === 'bg' ? '배경' : '현재 슬라이드') + '에 넣었습니다. 요소 탭에서 확대·이동으로 다듬어 보세요.', 'ok');
    toast('이미지를 생성했습니다.');
  } catch (err) {
    busy(false);
    let msg = String((err && err.message) || err);
    if (a.provider === 'openai' && err && err.code === 'NETWORK') {
      msg = 'OpenAI는 브라우저에서 직접 호출을 허용하지 않습니다(CORS). Gemini로 바꿔 다시 시도하거나, 위 프롬프트를 복사해 외부 도구에서 만든 뒤 2번 칸으로 올려 주세요.';
    }
    aiStatusSet(msg, 'err');
    console.warn('[cardnews] image generation failed:', err);
  }
}

/* ---------------- 모바일 화면 전환 ---------------- */
function setView(v) {
  const narrow = window.matchMedia('(max-width:1080px)').matches;
  const view = v || 'canvas';
  document.body.classList.toggle('mv-slides', narrow && view === 'slides');
  document.body.classList.toggle('mv-props', narrow && view === 'props');
  $$('#mobileBar button').forEach(b => b.classList.toggle('on', b.dataset.mv === view));
  requestAnimationFrame(() => {
    if (view === 'props') renderProps();
    renderStage();
    if (state.autoFit) setZoom(fitZoom(), true);
  });
}

/* =========================================================================
   저장 · 프로젝트 라이브러리 (localStorage 자동 저장, 여러 프로젝트)
   ========================================================================= */
const LIB_KEY = 'cardnews-projects-v1';
const V1_KEY = 'cardnews-studio-v1';
const library = { version: 3, activeId: null, projects: [], migrated: false };

function makeId(p) { return (p || 'p') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function defaultSlide(format, theme) {
  const f = FORMATS[format] || FORMATS['4:5'];
  const t = PRESETS[theme] || PRESETS.editorial;
  const bg = Object.assign(clone(t.bg), { src: '', overlay: 0 });
  if (!bg.c1) bg.c1 = bg.color;
  if (!bg.c2) bg.c2 = bg.color;
  const y = Math.round(f.h * .14);
  return {
    id: uid('sl'), bg, els: [
      textEl({
        x: Math.round(f.w * .084), y: y, w: Math.round(f.w * .832),
        text: '제목을 입력하세요', font: t.titleFont, size: 84, weight: 700,
        lh: 1.24, ls: -1.5, color: t.titleColor
      }),
      textEl({
        x: Math.round(f.w * .084), y: y + 236, w: Math.round(f.w * .832),
        text: '본문을 입력하세요', font: t.bodyFont, size: 36, weight: 400,
        lh: 1.66, color: t.bodyColor
      })
    ]
  };
}

function makeProject(opts) {
  const o = opts || {};
  const format = FORMATS[o.format] ? o.format : '4:5';
  const theme = PRESETS[o.theme] ? o.theme : 'editorial';
  const now = Date.now();
  return {
    id: makeId('p'),
    title: String(o.title || '').trim() || '새 카드뉴스',
    format, theme, createdAt: now, updatedAt: now,
    app: 'cardnews-studio', version: 3,
    slides: (o.slides && o.slides.length) ? o.slides : [defaultSlide(format, theme)]
  };
}

function normalizeProjectRecord(p) {
  if (!p || typeof p !== 'object') return null;
  if (!p.id) p.id = makeId('p');
  if (!p.title) p.title = '제목 없는 카드뉴스';
  if (!FORMATS[p.format]) p.format = '4:5';
  if (!PRESETS[p.theme]) p.theme = 'editorial';
  if (!Array.isArray(p.slides) || !p.slides.length) p.slides = [defaultSlide(p.format, p.theme)];
  p.slides.forEach(s => {
    if (!s.id) s.id = uid('sl');
    s.els = (s.els || []).map(e => {
      if (e.type === 'text') return textEl(e);
      if (e.type === 'image') return imageEl(e);
      return shapeEl(e);
    });
    if (!s.bg) s.bg = { type: 'solid', color: '#ffffff', c1: '#ffffff', c2: '#000000', angle: 135, src: '', overlay: 0 };
  });
  p.createdAt = p.createdAt || Date.now();
  p.updatedAt = p.updatedAt || Date.now();
  return p;
}

function writeLibrary() {
  try {
    localStorage.setItem(LIB_KEY, JSON.stringify({
      version: 3, activeId: library.activeId,
      projects: library.projects
    }));
    state._quotaWarned = false;
    return true;
  } catch (e) {
    if (!state._quotaWarned) {
      state._quotaWarned = true;
      toast('브라우저 저장 공간이 부족합니다. JSON으로 백업해 주세요.', true);
    }
    return false;
  }
}

function loadLibrary() {
  let data = null;
  try {
    const raw = localStorage.getItem(LIB_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) { data = null; }

  library.projects = [];
  library.activeId = null;
  library.migrated = false;

  if (data && Array.isArray(data.projects) && data.projects.length) {
    data.projects.forEach(p => { const n = normalizeProjectRecord(p); if (n) library.projects.push(n); });
    library.activeId = data.activeId || (library.projects[0] && library.projects[0].id) || null;
  }

  if (!library.projects.length) {
    // v2까지의 단일 작업 데이터가 있으면 첫 번째 프로젝트로 옮깁니다.
    let legacy = null;
    try { const raw = localStorage.getItem(V1_KEY); if (raw) legacy = JSON.parse(raw); } catch (e) { legacy = null; }
    if (legacy && Array.isArray(legacy.slides) && legacy.slides.length) {
      const p = normalizeProjectRecord({
        id: makeId('p'), title: legacy.title || '나의 카드뉴스', format: legacy.format,
        theme: 'editorial', slides: legacy.slides
      });
      p.migratedFromV2 = true;
      library.projects.push(p);
      library.activeId = p.id;
      library.migrated = true;
    } else {
      const sample = sampleProject();
      const p = makeProject({ title: '나의 카드뉴스', format: sample.format || '4:5', theme: 'editorial', slides: sample.slides });
      library.projects.push(p);
      library.activeId = p.id;
    }
    writeLibrary();
  }

  if (!library.projects.some(p => p.id === library.activeId)) library.activeId = library.projects[0].id;
  return library;
}

function activeProject() { return library.projects.find(p => p.id === library.activeId) || null; }

function scheduleSave() {
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(flushSave, 700);
}
function flushSave() {
  clearTimeout(state.saveTimer);
  const p = state.project;
  if (!p || !Array.isArray(p.slides) || !p.slides.length) return;
  p.updatedAt = Date.now();
  const i = library.projects.findIndex(x => x.id === p.id);
  if (i < 0) library.projects.unshift(p); else library.projects[i] = p;
  library.activeId = p.id;
  writeLibrary();
}

/* JSON 불러오기·예시 복원처럼 state.project를 통째로 바꿀 때 id를 이어받습니다. */
function adoptProject(proj) {
  const old = state.project;
  proj.id = (old && old.id) || makeId('p');
  proj.theme = PRESETS[proj.theme] ? proj.theme : (PRESETS[state.theme] ? state.theme : 'editorial');
  proj.createdAt = (old && old.createdAt) || Date.now();
  proj.updatedAt = Date.now();
  state.project = proj;
  state.theme = proj.theme;
  const i = library.projects.findIndex(x => x.id === proj.id);
  if (i >= 0) library.projects[i] = proj;
  scheduleSave();
  return proj;
}

/* =========================================================================
   v3 · 프로젝트 허브 (메인 화면)
   ========================================================================= */
function fmtDate(ts) {
  const d = new Date(ts || Date.now());
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  if (d.toDateString() === now.toDateString()) return '오늘 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.';
}

function projectPreview(p, maxW, maxH) {
  const f = FORMATS[p.format] || FORMATS['4:5'];
  const W = Math.min(maxW, Math.max(48, Math.floor(maxH * f.w / f.h)));
  const z = W / f.w;
  const box = document.createElement('div');
  box.className = 'pj-thumb';
  box.style.width = W + 'px';
  box.style.height = Math.round(f.h * z) + 'px';
  const inner = document.createElement('div');
  inner.className = 'pj-thumb-inner';
  inner.style.width = f.w + 'px';
  inner.style.height = f.h + 'px';
  inner.style.transform = 'scale(' + z + ')';
  const s = p.slides && p.slides[0];
  if (s) {
    try {
      bgParts(s.bg).forEach(n => inner.appendChild(n));
      (s.els || []).forEach(el => inner.appendChild(elNode(el, false)));
    } catch (e) { /* 미리보기 실패는 카드만 비움 */ }
  }
  box.appendChild(inner);
  return box;
}

function renderHub() {
  const grid = dom.pjGrid;
  if (!grid) return;
  const narrow = window.matchMedia('(max-width:520px)').matches;
  const maxW = narrow ? 146 : 208;
  const maxH = narrow ? 150 : 190;
  grid.innerHTML = '';
  const list = library.projects.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  dom.hubCount.textContent = library.projects.length + '개' + (library.migrated ? ' · 이전 작업을 첫 프로젝트로 불러왔습니다' : '');

  list.forEach(p => {
    const card = document.createElement('div');
    card.className = 'pj-card';
    card.dataset.pid = p.id;

    const prev = document.createElement('div');
    prev.className = 'pj-prev';
    prev.appendChild(projectPreview(p, maxW, maxH));
    prev.addEventListener('click', () => openProject(p.id));
    card.appendChild(prev);

    const nm = document.createElement('div');
    nm.className = 'pj-name';
    nm.textContent = p.title || '제목 없는 카드뉴스';
    nm.title = nm.textContent;
    nm.addEventListener('click', () => openProject(p.id));
    card.appendChild(nm);

    const f = FORMATS[p.format] || FORMATS['4:5'];
    const meta = document.createElement('div');
    meta.className = 'pj-meta';
    meta.innerHTML = '<span class="tag">' + esc(f.key + ' ' + f.w + '×' + f.h) + '</span>' +
      '<span>' + (p.slides ? p.slides.length : 0) + '장</span><span>·</span><span>' + esc(fmtDate(p.updatedAt)) + '</span>';
    card.appendChild(meta);

    const acts = document.createElement('div');
    acts.className = 'pj-acts';
    const open = document.createElement('button');
    open.className = 'btn small primary open';
    open.textContent = '열기';
    open.addEventListener('click', () => openProject(p.id));
    acts.appendChild(open);

    const set = document.createElement('button');
    set.className = 'btn small icon';
    set.title = '프로젝트 설정';
    set.setAttribute('aria-label', '프로젝트 설정');
    set.innerHTML = '<svg viewBox="0 0 20 20"><path d="M3.5 6.5h13M3.5 13.5h13"/><circle cx="7.5" cy="6.5" r="2"/><circle cx="13" cy="13.5" r="2"/></svg>';
    set.addEventListener('click', () => openProjectSettings(false, p));
    acts.appendChild(set);

    const dup = document.createElement('button');
    dup.className = 'btn small icon';
    dup.title = '프로젝트 복제';
    dup.setAttribute('aria-label', '프로젝트 복제');
    dup.innerHTML = '<svg viewBox="0 0 20 20"><rect x="7" y="7" width="9" height="9" rx="1.8"/><path d="M13 7V5.2A1.2 1.2 0 0 0 11.8 4H5.2A1.2 1.2 0 0 0 4 5.2v6.6A1.2 1.2 0 0 0 5.2 13H7"/></svg>';
    dup.addEventListener('click', () => duplicateProject(p.id));
    acts.appendChild(dup);

    const del = document.createElement('button');
    del.className = 'btn small icon danger';
    del.title = '프로젝트 삭제';
    del.setAttribute('aria-label', '프로젝트 삭제');
    del.innerHTML = '<svg viewBox="0 0 20 20"><path d="M4 6.5h12M8 6.5V4.6h4v1.9M6 6.5l.7 9.2A1.2 1.2 0 0 0 7.9 16.8h4.2a1.2 1.2 0 0 0 1.2-1.1l.7-9.2"/></svg>';
    del.addEventListener('click', () => confirmDeleteProject(p.id));
    acts.appendChild(del);

    card.appendChild(acts);
    grid.appendChild(card);
  });

  const add = document.createElement('button');
  add.className = 'pj-new';
  add.innerHTML = '<span class="plus">＋</span><span>새 프로젝트</span>';
  add.addEventListener('click', () => openProjectSettings(true));
  grid.appendChild(add);
}

function showHub() {
  flushSave();
  renderHub();
  if (dom.hub) dom.hub.hidden = false;
  document.body.classList.add('hub-open');
}
function hideHub() {
  if (dom.hub) dom.hub.hidden = true;
  document.body.classList.remove('hub-open');
}

function openProject(id) {
  flushSave();
  const p = library.projects.find(x => x.id === id);
  if (!p) return;
  library.activeId = p.id;
  state.project = p;
  state.theme = PRESETS[p.theme] ? p.theme : 'editorial';
  state.slideIndex = 0;
  state.selId = null;
  state.editing = null;
  resetHistory();
  hideHub();
  renderAll();
  updateTop();
  if (window.matchMedia('(max-width:1080px)').matches) setView('canvas');
  requestAnimationFrame(() => { if (state.autoFit) setZoom(fitZoom(), true); renderStage(); });
  setTimeout(() => { if (state.autoFit) setZoom(fitZoom(), true); }, 260);
  scheduleSave();
  toast('프로젝트를 열었습니다 · ' + (p.title || ''));
}

function duplicateProject(id) {
  flushSave();
  const src = library.projects.find(x => x.id === id);
  if (!src) return;
  const c = normalizeProjectRecord(clone(src));
  c.id = makeId('p');
  c.title = (src.title || '카드뉴스') + ' 복사본';
  c.createdAt = c.updatedAt = Date.now();
  c.slides.forEach(s => { s.id = uid('sl'); (s.els || []).forEach(e => e.id = uid(e.type[0])); });
  const i = library.projects.findIndex(x => x.id === id);
  library.projects.splice(i + 1, 0, c);
  writeLibrary();
  renderHub();
  toast('프로젝트를 복제했습니다.');
}

function confirmDeleteProject(id) {
  const p = library.projects.find(x => x.id === id);
  if (!p) return;
  openModal('프로젝트 삭제',
    `<p style="font-size:12.5px;line-height:1.75;margin:0">“<b>${esc(p.title || '제목 없는 카드뉴스')}</b>” 프로젝트(${p.slides.length}장)를 삭제합니다.<br>
     이 브라우저에서 되돌릴 수 없습니다. 필요하면 먼저 작업 화면에서 <b>JSON</b>으로 내보내 두세요.</p>`,
    [
      { label: '취소', cls: 'subtle', close: true },
      { label: '삭제', cls: 'danger', onClick: () => {
        const i = library.projects.findIndex(x => x.id === id);
        if (i < 0) return;
        library.projects.splice(i, 1);
        if (!library.projects.length) {
          const np = makeProject({ title: '새 카드뉴스', format: '4:5', theme: 'editorial' });
          library.projects.push(np);
          library.activeId = np.id;
        } else if (library.activeId === id) {
          library.activeId = library.projects[0].id;
          if (!dom.hub.hidden) { /* 허브에 머무름 */ }
        }
        writeLibrary();
        closeModal();
        renderHub();
        toast('프로젝트를 삭제했습니다.');
      } }
    ]);
}

/* ---------- 프로젝트 설정 모달 (새 프로젝트 · 기존 설정) ---------- */
let _settingsTarget = null;
function openProjectSettings(isNew, target) {
  const isNewP = !!isNew;
  _settingsTarget = isNewP ? null : (target || state.project);
  const p = _settingsTarget || state.project;
  const cur = isNewP
    ? { title: '', format: (state.project && state.project.format) || '4:5', theme: PRESETS[state.theme] ? state.theme : 'editorial' }
    : { title: p.title || '', format: p.format || '4:5', theme: PRESETS[p.theme] ? p.theme : 'editorial' };

  const body = `
    <div class="set-wrap">
      <div>
        <span class="set-lbl">프로젝트 이름</span>
        <input id="setTitle" class="set-input" maxlength="48" spellcheck="false"
               placeholder="예: 11월 신제품 카드뉴스" value="${esc(cur.title)}">
      </div>
      <div>
        <span class="set-lbl">캔버스 비율</span>
        <div class="fmt-pick" id="setFmt">
          ${Object.values(FORMATS).map(f => `<button type="button" data-fmt="${f.key}" class="${cur.format === f.key ? 'on' : ''}"><span>${esc(f.name)}</span><small>${f.w}×${f.h}</small></button>`).join('')}
        </div>
      </div>
      <div>
        <span class="set-lbl">기본 테마</span>
        <div class="theme-pick" id="setTheme">
          ${Object.values(PRESETS).map(t => `<button type="button" data-theme="${t.key}" class="${cur.theme === t.key ? 'on' : ''}"><span class="sw">${t.sw.map(c => `<i style="background:${c}"></i>`).join('')}</span><span>${esc(t.name)}</span></button>`).join('')}
        </div>
      </div>
      ${isNewP
        ? '<p class="mini" style="margin:0">선택한 비율·테마로 빈 카드 1장이 만들어집니다.</p>'
        : '<label class="set-check"><input type="checkbox" id="setApplyTheme"><span>이 테마를 지금 프로젝트의 <b>모든 슬라이드</b>에 적용 (배경·글자 색). 끄면 새 슬라이드의 기본값만 바뀝니다.</span></label>'}
    </div>`;

  openModal(isNewP ? '새 프로젝트' : '프로젝트 설정', body, isNewP
    ? [{ label: '취소', cls: 'subtle', close: true }, { label: '만들기', cls: 'primary', onClick: () => saveProjectSettings(true) }]
    : [{ label: '취소', cls: 'subtle', close: true }, { label: '저장', cls: 'primary', onClick: () => saveProjectSettings(false) }]);

  const pick = (sel, attr) => {
    dom.modal.querySelectorAll(sel + ' button').forEach(b => b.addEventListener('click', () => {
      dom.modal.querySelectorAll(sel + ' button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
    }));
  };
  pick('#setFmt', 'data-fmt');
  pick('#setTheme', 'data-theme');
  const titleInput = $('#setTitle');
  if (titleInput) titleInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const btn = dom.modal.querySelector('.modal-f .btn.primary');
    if (btn) btn.click();
  });
  setTimeout(() => { const t = $('#setTitle'); if (t) { t.focus(); t.select(); } }, 30);
}

function saveProjectSettings(isNew) {
  const titleEl = $('#setTitle');
  const fmtOn = dom.modal.querySelector('#setFmt .on');
  const themeOn = dom.modal.querySelector('#setTheme .on');
  const title = (titleEl ? titleEl.value : '').trim();
  const format = (fmtOn && fmtOn.dataset.fmt) || '4:5';
  const theme = (themeOn && themeOn.dataset.theme) || 'editorial';

  if (isNew) {
    const p = makeProject({ title: title || '새 카드뉴스', format, theme });
    library.projects.unshift(p);
    library.activeId = p.id;
    writeLibrary();
    closeModal();
    openProject(p.id);
    return;
  }

  const p = _settingsTarget || state.project;
  const isActive = (p === state.project);
  p.title = title || '제목 없는 카드뉴스';
  if (FORMATS[format]) p.format = format;
  p.theme = theme;
  const applyAll = $('#setApplyTheme') && $('#setApplyTheme').checked;
  if (applyAll && PRESETS[theme]) p.slides.forEach(s => applyPresetToSlide(s, PRESETS[theme]));
  p.updatedAt = Date.now();
  closeModal();

  if (isActive) {
    state.theme = theme;
    dom.projTitle.value = p.title;
    pushHistory(); renderAll();
    updateTop();
    requestAnimationFrame(() => { if (state.autoFit) setZoom(fitZoom(), true); renderStage(); });
  } else {
    const i = library.projects.findIndex(x => x.id === p.id);
    if (i >= 0) library.projects[i] = p;
    writeLibrary();
    renderHub();
  }
  scheduleSave();
  toast('프로젝트 설정을 저장했습니다.');
}

/* =========================================================================
   v3 · 슬라이드 끌어서 순서 변경 (마우스·터치)
   ========================================================================= */
const thumbDrag = { active: false };

function thumbFromTarget(target) {
  const t = target && target.closest ? target.closest('.thumb') : null;
  return (t && dom.thumbs.contains(t)) ? t : null;
}
function thumbIndexOf(el) {
  return Array.from(dom.thumbs.querySelectorAll('.thumb')).indexOf(el);
}

function startThumbDrag(el, x, y) {
  if (thumbDrag.active) return;
  const idx = thumbIndexOf(el);
  if (idx < 0) return;
  const r = el.getBoundingClientRect();
  const all = dom.thumbs.querySelectorAll('.thumb');
  const second = all[1];
  thumbDrag.active = true;
  thumbDrag.index = idx;
  thumbDrag.el = el;
  thumbDrag.grid = !!(second && Math.abs(all[0].getBoundingClientRect().left - second.getBoundingClientRect().left) > 4);
  thumbDrag.grabDX = x - r.left;
  thumbDrag.grabDY = y - r.top;

  const ph = document.createElement('div');
  ph.className = 'thumb-ph';
  ph.style.width = r.width + 'px';
  ph.style.height = r.height + 'px';
  el.parentNode.insertBefore(ph, el.nextSibling);
  el.classList.add('is-drag-src');

  const ghost = el.cloneNode(true);
  ghost.classList.remove('is-drag-src');
  ghost.classList.add('thumb-ghost');
  ghost.querySelectorAll('.del,.grip').forEach(n => n.remove());
  ghost.style.left = r.left + 'px';
  ghost.style.top = r.top + 'px';
  ghost.style.width = r.width + 'px';
  ghost.style.height = r.height + 'px';
  document.body.appendChild(ghost);

  thumbDrag.ph = ph;
  thumbDrag.ghost = ghost;
  document.body.classList.add('thumb-dragging');
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* 무시 */ }
  moveThumbDrag(x, y);
  requestAnimationFrame(thumbAutoScroll);
}

/* 끌고 있는 동안 목록 위·아래 가장자리에서 자동 스크롤 */
function thumbAutoScroll() {
  if (!thumbDrag.active) return;
  const cr = dom.thumbs.getBoundingClientRect();
  const x = thumbDrag.px, y = thumbDrag.py;
  let dy = 0;
  if (y < cr.top + 40) dy = -Math.min(20, (cr.top + 40 - y) / 2 + 5);
  else if (y > cr.bottom - 40) dy = Math.min(20, (y - (cr.bottom - 40)) / 2 + 5);
  if (dy) {
    const before = dom.thumbs.scrollTop;
    dom.thumbs.scrollTop = before + dy;
    if (dom.thumbs.scrollTop !== before) moveThumbDrag(x, y);
  }
  requestAnimationFrame(thumbAutoScroll);
}

function moveThumbDrag(x, y) {
  if (!thumbDrag.active) return;
  thumbDrag.px = x; thumbDrag.py = y;
  const g = thumbDrag.ghost;
  g.style.left = (x - thumbDrag.grabDX) + 'px';
  g.style.top = (y - thumbDrag.grabDY) + 'px';

  const over = document.elementFromPoint(x, y);
  const t = over && over.closest ? over.closest('.thumb') : null;
  const ph0 = thumbDrag.ph;
  if (t && t !== thumbDrag.el) {
    const r = t.getBoundingClientRect();
    let before;
    if (thumbDrag.grid) {
      if (y < r.top) before = true;
      else if (y > r.bottom) before = false;
      else before = x <= r.left + r.width / 2;
    } else {
      before = y <= r.top + r.height / 2;
    }
    if (before) {
      if (t.previousElementSibling !== ph0) dom.thumbs.insertBefore(ph0, t);
    } else if (t.nextElementSibling !== ph0) {
      dom.thumbs.insertBefore(ph0, t.nextElementSibling);
    }
  } else if (!t) {
    // 목록 바깥(위·아래)으로 끌어도 순서를 바꿀 수 있게 합니다.
    const cr = dom.thumbs.getBoundingClientRect();
    if (y <= cr.top + 10) {
      if (dom.thumbs.firstElementChild !== ph0) dom.thumbs.insertBefore(ph0, dom.thumbs.firstElementChild);
    } else if (y >= cr.bottom - 10) {
      if (dom.thumbs.lastElementChild !== ph0) dom.thumbs.appendChild(ph0);
    }
  }
}

function endThumbDrag(cancelled) {
  if (!thumbDrag.active) return;
  const dragEl = thumbDrag.el, ph = thumbDrag.ph, ghost = thumbDrag.ghost;
  const from = thumbDrag.index;
  let to = from;

  if (!cancelled && ph) {
    const order = Array.from(dom.thumbs.children)
      .filter(n => n.classList.contains('thumb') || n.classList.contains('thumb-ph'))
      .filter(n => n !== dragEl);
    const pi = order.indexOf(ph);
    if (pi >= 0) to = pi;
  }

  dragEl.classList.remove('is-drag-src');
  if (ph && ph.parentNode) ph.parentNode.removeChild(ph);
  if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
  document.body.classList.remove('thumb-dragging');
  thumbDrag.active = false;
  thumbDrag.el = thumbDrag.ph = thumbDrag.ghost = null;
  state._thumbClickAt = Date.now();

  if (cancelled || to === from) return;
  const arr = state.project.slides;
  if (from < 0 || from >= arr.length || to < 0 || to >= arr.length) return;
  const moved = arr.splice(from, 1)[0];
  arr.splice(to, 0, moved);
  if (state.slideIndex === from) state.slideIndex = to;
  else if (from < state.slideIndex && to >= state.slideIndex) state.slideIndex--;
  else if (from > state.slideIndex && to <= state.slideIndex) state.slideIndex++;
  pushHistory();
  renderAll();
  toast('슬라이드 ' + (from + 1) + ' → ' + (to + 1) + '번째로 이동했습니다.');
}

function wireThumbDrag() {
  if (!dom.thumbs) return;
  let pending = null;
  let touchRec = null;

  // 마우스·펜
  dom.thumbs.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;
    if (e.button !== 0) return;
    const el = thumbFromTarget(e.target);
    if (!el || (e.target.closest && e.target.closest('.del'))) return;
    pending = { el, x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointermove', e => {
    if (!pending || e.pointerType === 'touch') return;
    if (!thumbDrag.active) {
      if (Math.hypot(e.clientX - pending.x, e.clientY - pending.y) < 5) return;
      startThumbDrag(pending.el, e.clientX, e.clientY);
    }
    if (thumbDrag.active) { e.preventDefault(); moveThumbDrag(e.clientX, e.clientY); }
  }, { passive: false });
  window.addEventListener('pointerup', e => {
    if (_thumbLongPress) { clearTimeout(_thumbLongPress.timer); _thumbLongPress = null; }
    if (thumbDrag.active && e.pointerType !== 'touch') endThumbDrag(false);
    pending = null;
  });
  window.addEventListener('pointercancel', () => {
    if (thumbDrag.active) endThumbDrag(true);
    pending = null;
  });

  // 터치 (잠시 길게 누른 뒤 끌기 · 그 전에는 목록 스크롤)
  var _thumbLongPress = null;
  dom.thumbs.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) {
      if (_thumbLongPress) { clearTimeout(_thumbLongPress.timer); _thumbLongPress = null; }
      return;
    }
    const el = thumbFromTarget(e.target);
    if (!el || (e.target.closest && e.target.closest('.del'))) return;
    const t = e.touches[0];
    const rec = { el, x: t.clientX, y: t.clientY, timer: 0 };
    rec.timer = setTimeout(() => {
      if (_thumbLongPress !== rec) return;
      startThumbDrag(el, rec.x, rec.y);
    }, 300);
    _thumbLongPress = rec;
  }, { passive: true });
  dom.thumbs.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (!t) return;
    if (!thumbDrag.active) {
      if (_thumbLongPress && Math.hypot(t.clientX - _thumbLongPress.x, t.clientY - _thumbLongPress.y) > 10) {
        clearTimeout(_thumbLongPress.timer);
        _thumbLongPress = null;
      }
      return;
    }
    e.preventDefault();
    moveThumbDrag(t.clientX, t.clientY);
  }, { passive: false });
  const endTouch = () => {
    if (_thumbLongPress) { clearTimeout(_thumbLongPress.timer); _thumbLongPress = null; }
    if (thumbDrag.active) endThumbDrag(false);
  };
  dom.thumbs.addEventListener('touchend', endTouch);
  dom.thumbs.addEventListener('touchcancel', () => {
    if (_thumbLongPress) { clearTimeout(_thumbLongPress.timer); _thumbLongPress = null; }
    if (thumbDrag.active) endThumbDrag(true);
  });
}

/* =========================================================================

  });

  // 도구 막대
  dom.addBar.addEventListener('click', e => {

    else if (k === 'image') { state.fileIntent = { kind: 'insert', target: state.ai.target }; dom.imgInput.click(); }
    else if (k === 'ai') {
      state.tab = 'ai';
      if (window.matchMedia('(max-width:1080px)').matches) setView('props');
      else renderProps();
    }
    else addShape(k);
  });

  // 캔버스 빈 곳 클릭 → 선택 해제
  dom.stageInner.addEventListener('pointerdown', e => {
    if (state.editing) return;
    if (e.target.closest('.el') || e.target.closest('.h')) return;
    if (state.selId) { state.selId = null; renderSel(); renderProps(); }
  });

  // 선택 박스 핸들
  dom.selBox.addEventListener('pointerdown', e => {
    const h = e.target.closest('.h'); if (!h) return;
    const el = selEl(); if (!el) return;
    e.stopPropagation(); e.preventDefault();
    startDrag(e, el, 'resize', h.dataset.dir);
  });

  // 속성 패널
  dom.tabs.addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    state.tab = b.dataset.tab;
    renderProps();
  });
  dom.propsBody.addEventListener('input', e => {
    if (e.target.dataset.scope) applyControl(e.target);
  });
  dom.propsBody.addEventListener('change', e => {
    if (e.target.dataset && e.target.dataset.scope) pushHistory();
  });
  dom.propsBody.addEventListener('click', onPropsClick);

  // 줌
  dom.zoomIn.addEventListener('click', () => { setZoom(state.zoom + .05, false); });
  dom.zoomOut.addEventListener('click', () => { setZoom(state.zoom - .05, false); });
  dom.zoomFit.addEventListener('click', () => { setZoom(fitZoom(), true); });

  // 파일 입력
  dom.imgInput.addEventListener('change', async () => {
    const file = dom.imgInput.files[0];
    const intent = state.fileIntent || { kind: 'insert' };
    state.fileIntent = null;
    dom.imgInput.value = '';
    if (!file) return;
    if (intent.kind === 'replace') {
      const el = selEl();
      if (!el) return;
      const src = await readDataURL(file);
      if (!src) return;
      el.src = src; imgCache.delete(src);
      pushHistory(); renderStage(); renderThumbsSoon(); renderProps();
      toast('이미지를 교체했습니다.');
      return;
    }
    await progressImageFile(file, intent.target || state.ai.target);
  });
  dom.bgInput.addEventListener('change', async () => {
    const file = dom.bgInput.files[0];
    if (!file) return;
    const src = await readDataURL(file);
    const bg = curSlide().bg;
    bg.type = 'image'; bg.src = src;
    imgCache.delete(src);
    pushHistory(); renderStage(); renderThumbsSoon(); renderProps();
    dom.bgInput.value = '';
    toast('배경 이미지를 넣었습니다. 오버레이로 글자 대비를 조절하세요.');
  });
  dom.fontInput.addEventListener('change', async () => {
    const files = Array.from(dom.fontInput.files || []);
    let added = 0;
    for (const file of files) {
      try {
        const buf = await file.arrayBuffer();
        const family = 'CNF' + (state.customFonts.length + 1) + '_' + Date.now().toString(36).slice(-3);
        const face = new FontFace(family, buf);
        await face.load();
        document.fonts.add(face);
        const label = file.name.replace(/\.(ttf|otf|woff2?|TTF|OTF|WOFF2?)$/, '');
        state.customFonts.push({ name: 'custom:' + family, family, label });
        added++;
      } catch (err) {
        console.error(err);
        toast('폰트 등록 실패: ' + file.name, true);
      }
    }
    dom.fontInput.value = '';
    if (added) {
      state.tab = 'font'; renderProps();
      toast(added + '개 폰트를 등록했습니다. 글자를 선택하고 목록에서 골라 주세요.');
    }
  });

  // 드래그 앤 드롭
  ['dragenter', 'dragover'].forEach(t => dom.stageScroll.addEventListener(t, e => {
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
    dom.stageInner.style.outline = '2px dashed #5B5BF5';
  }));
  dom.stageScroll.addEventListener('dragleave', e => {
    if (!dom.stageScroll.contains(e.relatedTarget)) dom.stageInner.style.outline = '';
  });
  dom.stageScroll.addEventListener('drop', async e => {
    e.preventDefault();
    dom.stageInner.style.outline = '';
    const files = Array.from(e.dataTransfer.files || []);
    const dropPt = { x: 0, y: 0 };
    try { const p = toLogical(e); dropPt.x = p.x; dropPt.y = p.y; } catch (err) {}
    for (const file of files) {
      if (/\.json$/i.test(file.name) || file.type === 'application/json') {
        const txt = await file.text();
        try {
          const proj = normalizeProject(txt, state.project.format);
          adoptProject(proj);
          state.slideIndex = 0; state.selId = null;
          resetHistory(); renderAll();
          requestAnimationFrame(() => { setZoom(fitZoom(), true); });
          toast(proj.slides.length + '장 카드뉴스를 불러왔습니다.');
        } catch (err) { toast('JSON 불러오기 실패: ' + err.message, true); }
      } else if (/\.(ttf|otf|woff2?)$/i.test(file.name)) {
        try {
          const buf = await file.arrayBuffer();
          const family = 'CNF' + (state.customFonts.length + 1) + '_' + Date.now().toString(36).slice(-3);
          const face = new FontFace(family, buf);
          await face.load(); document.fonts.add(face);
          state.customFonts.push({ name: 'custom:' + family, family, label: file.name.replace(/\.\w+$/, '') });
          state.tab = 'font'; renderProps();
          toast('폰트를 등록했습니다 · ' + file.name);
        } catch (err) { toast('폰트 등록 실패', true); }
      } else if (/^image\//.test(file.type) || /\.(png|jpe?g|webp|svg)$/i.test(file.name)) {
        await insertImageFile(file, dropPt);
      }
    }
  });

  // 키보드
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      if (typing) return;
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { if (typing) return; e.preventDefault(); redo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
      if (typing) return;
      e.preventDefault(); duplicateSel(); return;
    }
    if (typing) return;
    if (e.key === 'Escape') { state.selId = null; renderSel(); renderProps(); closeModal(); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && state.selId) { e.preventDefault(); deleteSel(); return; }
    if (e.key.startsWith('Arrow') && state.selId) {
      const el = selEl(); if (!el) return;
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      if (e.key === 'ArrowLeft') el.x -= step;
      if (e.key === 'ArrowRight') el.x += step;
      if (e.key === 'ArrowUp') el.y -= step;
      if (e.key === 'ArrowDown') el.y += step;
      renderStage(); renderThumbsSoon();
      clearTimeout(wire._nudge);
      wire._nudge = setTimeout(pushHistory, 400);
    }
  });

  // 창 크기
  let rT = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rT);
    rT = setTimeout(() => { if (state.autoFit) setZoom(fitZoom(), true); }, 120);
  });

  dom.modalRoot.addEventListener('click', e => {
    if (e.target.classList.contains('modal-bg')) closeModal();
  });

  /* ---------- v2: 모바일 화면 전환 ---------- */
  if (dom.mobileBar) {
    dom.mobileBar.addEventListener('click', e => {
      const b = e.target.closest('[data-mv]');
      if (!b) return;
      if (b.dataset.mv === 'hub') { showHub(); return; }
      setView(b.dataset.mv);
    });
  }
  if (dom.btnMore) {
    dom.btnMore.addEventListener('click', e => {
      const r = e.currentTarget.getBoundingClientRect();
      showMenu(Math.max(8, r.right - 212), r.bottom + 6, [
        { label: '프로젝트 목록 (메인)', fn: showHub },
        { label: '프로젝트 설정', fn: () => openProjectSettings(false) },
        { label: '실행취소', hint: 'Ctrl+Z', fn: undo },
        { label: '다시실행', hint: 'Ctrl+Shift+Z', fn: redo },
        { label: 'JSON 불러오기 · 내보내기', fn: openJsonModal },
        { label: '도움말', fn: openHelp }
      ]);
    });
  }

  /* ---------- v3: 프로젝트 허브 · 설정 · 슬라이드 드래그 ---------- */
  if (dom.btnHub) dom.btnHub.addEventListener('click', showHub);
  if (dom.btnProjSet) dom.btnProjSet.addEventListener('click', () => openProjectSettings(false));
  if (dom.hubNew) dom.hubNew.addEventListener('click', () => openProjectSettings(true));
  if (dom.hubSample) dom.hubSample.addEventListener('click', () => {
    flushSave();
    const sp = sampleProject();
    const p = makeProject({ title: '예시 카드뉴스', format: sp.format || '4:5', theme: 'editorial', slides: sp.slides });
    library.projects.unshift(p);
    library.activeId = p.id;
    writeLibrary();
    openProject(p.id);
  });
  wireThumbDrag();
  window.addEventListener('resize', () => {
    const narrow = window.matchMedia('(max-width:1080px)').matches;
    if (narrow !== wire._narrow) {
      wire._narrow = narrow;
      setView('canvas');
    }
  });
  wire._narrow = window.matchMedia('(max-width:1080px)').matches;

  /* ---------- v2: AI 탭 입력·드롭·붙여넣기 ---------- */
  dom.propsBody.addEventListener('input', e => {
    const t = e.target;
    const k = t.dataset && t.dataset.ai;
    if (k) { state.ai[k] = t.value; aiSave(); aiRefreshPrompt(); return; }
    if (t.id === 'aiNoText') { state.ai.noText = !!t.checked; aiSave(); aiRefreshPrompt(); return; }
    if (t.id === 'aiModel') { state.ai.model[state.ai.provider] = t.value.trim(); aiSave(); }
  });
  ['dragenter', 'dragover'].forEach(tp => dom.propsBody.addEventListener(tp, e => {
    if (!e.dataTransfer || Array.from(e.dataTransfer.types || []).indexOf('Files') < 0) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    const dz = e.target.closest && e.target.closest('#aiDrop');
    if (dz) dz.classList.add('over');
  }));
  dom.propsBody.addEventListener('dragleave', e => {
    const dz = e.target.closest && e.target.closest('#aiDrop');
    if (dz) dz.classList.remove('over');
  });
  dom.propsBody.addEventListener('drop', async e => {
    const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
    if (!files.length) return;
    const img = files.find(f => /^image\//.test(f.type) || /\.(png|jpe?g|webp|svg)$/i.test(f.name));
    if (!img) return;
    e.preventDefault();
    const dz = e.target.closest && e.target.closest('#aiDrop');
    if (dz) dz.classList.remove('over');
    await progressImageFile(img, state.ai.target);
  });
  document.addEventListener('paste', async e => {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (const it of items) {
      if (it.type && it.type.indexOf('image/') === 0) {
        const f = it.getAsFile();
        if (f) { e.preventDefault(); await progressImageFile(f, state.ai.target); return; }
      }
    }
  });
}

/* ---------------- 팝오버 메뉴 ---------------- */
function showMenu(x, y, items) {
  const old = $('#popMenu'); if (old) old.remove();
  const m = document.createElement('div');
  m.id = 'popMenu';
  m.style.cssText = `position:fixed;left:${x}px;top:${y}px;z-index:400;background:#fff;border:1px solid #E4E6EA;border-radius:10px;box-shadow:0 18px 40px rgba(15,23,42,.18);padding:5px;min-width:212px`;
  items.forEach(it => {
    const b = document.createElement('button');
    b.style.cssText = 'display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:7px;font-size:12px;font-weight:600;color:#14171C;text-align:left';
    b.innerHTML = `<span>${esc(it.label)}</span><span style="font-size:10.5px;color:#8B929D;font-weight:600">${esc(it.hint || '')}</span>`;
    b.onmouseenter = () => b.style.background = '#F5F6F8';
    b.onmouseleave = () => b.style.background = 'transparent';
    b.onclick = () => { m.remove(); it.fn(); };
    m.appendChild(b);
  });
  document.body.appendChild(m);
  const close = ev => { if (!m.contains(ev.target)) { m.remove(); document.removeEventListener('pointerdown', close); } };
  setTimeout(() => document.addEventListener('pointerdown', close), 0);
}

/* =========================================================================
   시작
   ========================================================================= */
function boot() {
  cacheDom();
  aiLoad();
  loadLibrary();
  const active = activeProject() || library.projects[0];
  state.project = active;
  state.theme = PRESETS[active.theme] ? active.theme : 'editorial';
  if (!FORMATS[state.project.format]) state.project.format = '4:5';

  resetHistory();
  wire();
  renderStage(); renderThumbs(); renderProps(); updateTop();
  state.tab = 'el';
  if (window.matchMedia('(max-width:1080px)').matches) setView('canvas');

  // 진입하면 프로젝트 허브(메인)부터 보여줍니다.
  renderHub();
  if (dom.hub) dom.hub.hidden = false;
  document.body.classList.add('hub-open');

  requestAnimationFrame(() => {
    setZoom(fitZoom(), true);
    renderStage();
  });
  setTimeout(() => {
    if (state.autoFit) { setZoom(fitZoom(), true); }
  }, 350);

  // 폰트가 늦게 도착하면 큐빅 배치를 다시 그립니다 (마스크가 대체 폰트로 만들어질 수 있음)
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      stoneCache.clear();
      try { if (state.project) renderStage(); } catch (e) {}
    }).catch(() => {});
  }

  // 로그인 없이 같은 탭에서 다시 열 때를 위해 허브 상태를 다시 계산
  window.addEventListener('beforeunload', () => { try { flushSave(); } catch (e) {} });

  // 디버그/검증용 (읽기 전용 정보)
  window.__CN = {
    state,
    version: '3.2',
    exportShape,
    normalizeProject,
    renderSlideCanvas,
    ai: { prompt: aiPromptText, generate: aiGenerate, key: aiKeyGet },
    setView,
    library,
    render: () => { renderStage(); renderThumbsSoon(); renderProps(); },
    hub: { show: showHub, hide: hideHub, render: renderHub, open: openProject, settings: openProjectSettings },
    drag: { start: startThumbDrag, move: moveThumbDrag, end: endThumbDrag, current: thumbDrag },
    stones: {
      themes: STONE_THEMES,
      defaults: stoneDefaults,
      add: addStonesText,
      enable: enableStones,
      canvas: el => getStoneCanvas(el),
      points: el => { const m = stoneMetrics(el); return stonePoints(el, stoneMask(el, m)); },
      mask: el => stoneMask(el, stoneMetrics(el)),
      clear: () => stoneCache.clear()
    },
    get project() { return state.project; }
  };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>

<script id="rpLockScript">
(function () {
  'use strict';

  var PASSWORD_HASH = '9552e277ebcc7fa191292c6e900d94dfe6e837d8abf76a2da927d4530d2c8f69';
  var STORE_KEY = 'cardnews.lock.v1';
  var STORE_VAL = 'unlocked';

  /* ---------- pure-JS SHA-256 (works on https:// and file://) ---------- */
  var K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];

  function utf8Bytes(str) {
    var out = [], i, c, d, cp;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 0x80) {
        out.push(c);
      } else if (c < 0x800) {
        out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
      } else if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length &&
                 (d = str.charCodeAt(i + 1)) >= 0xdc00 && d <= 0xdfff) {
        cp = 0x10000 + ((c - 0xd800) << 10) + (d - 0xdc00);
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3f),
                 0x80 | ((cp >> 6) & 0x3f), 0x80 | (cp & 0x3f));
        i++;
      } else {
        out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
      }
    }
    return out;
  }

  function sha256Hex(str) {
    var bytes = utf8Bytes(String(str == null ? '' : str));
    var len = bytes.length;
    var total = (((len + 9) + 63) >> 6) << 6;
    var msg = new Array(total);
    var i;

    for (i = 0; i < len; i++) msg[i] = bytes[i] & 0xff;
    msg[len] = 0x80;
    for (i = len + 1; i < total; i++) msg[i] = 0;

    var hi = Math.floor(len / 536870912);
    var lo = (len * 8) >>> 0;
    msg[total - 8] = (hi >>> 24) & 0xff;
    msg[total - 7] = (hi >>> 16) & 0xff;
    msg[total - 6] = (hi >>> 8) & 0xff;
    msg[total - 5] = hi & 0xff;
    msg[total - 4] = (lo >>> 24) & 0xff;
    msg[total - 3] = (lo >>> 16) & 0xff;
    msg[total - 2] = (lo >>> 8) & 0xff;
    msg[total - 1] = lo & 0xff;

    var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
             0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var w = new Array(64);
    var off, a, b, c, d, e, f, g, h, t1, t2, s0, s1, ch, maj, j, tmp;

    for (off = 0; off < total; off += 64) {
      for (j = 0; j < 16; j++) {
        w[j] = ((msg[off + j * 4] << 24) | (msg[off + j * 4 + 1] << 16) |
                (msg[off + j * 4 + 2] << 8) | msg[off + j * 4 + 3]) >>> 0;
      }
      for (j = 16; j < 64; j++) {
        tmp = w[j - 15];
        s0 = ((tmp >>> 7) | (tmp << 25)) ^ ((tmp >>> 18) | (tmp << 14)) ^ (tmp >>> 3);
        tmp = w[j - 2];
        s1 = ((tmp >>> 17) | (tmp << 15)) ^ ((tmp >>> 19) | (tmp << 13)) ^ (tmp >>> 10);
        w[j] = (w[j - 16] + s0 + w[j - 7] + s1) >>> 0;
      }
      a = H[0]; b = H[1]; c = H[2]; d = H[3];
      e = H[4]; f = H[5]; g = H[6]; h = H[7];
      for (j = 0; j < 64; j++) {
        s1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        ch = (e & f) ^ (~e & g);
        t1 = (h + s1 + ch + K[j] + w[j]) >>> 0;
        s0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        maj = (a & b) ^ (a & c) ^ (b & c);
        t2 = (s0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
      H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
      H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    var hex = '';
    for (i = 0; i < 8; i++) hex += ('00000000' + H[i].toString(16)).slice(-8);
    return hex;
  }

  function sameHex(a, b) {
    if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
    var diff = 0, i;
    for (i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return diff === 0;
  }

  function normalize(value) {
    return String(value == null ? '' : value).replace(/^\s+|\s+$/g, '');
  }

  function verify(value) {
    return sameHex(sha256Hex(normalize(value)), PASSWORD_HASH);
  }

  /* ---------- session unlock state ---------- */
  var memoryUnlocked = false;

  function isUnlocked() {
    try { return window.sessionStorage.getItem(STORE_KEY) === STORE_VAL; }
    catch (e) { return memoryUnlocked; }
  }

  function saveUnlocked(on) {
    memoryUnlocked = !!on;
    try {
      if (on) window.sessionStorage.setItem(STORE_KEY, STORE_VAL);
      else window.sessionStorage.removeItem(STORE_KEY);
    } catch (e) { /* storage blocked: keep the state in memory for this page only */ }
  }

  /* ---------- screen ---------- */
  var root = document.documentElement;
  var form = document.getElementById('lockForm');
  var input = document.getElementById('lockInput');
  var errorEl = document.getElementById('lockError');
  var eyeBtn = document.getElementById('lockEye');
  var submitBtn = document.getElementById('lockSubmit');
  var wrongCount = 0;
  var cooling = false;

  function focusInput() {
    if (!input || isUnlocked()) return;
    try { input.focus({ preventScroll: true }); }
    catch (e) { try { input.focus(); } catch (e2) {} }
    try { input.setSelectionRange(input.value.length, input.value.length); } catch (e3) {}
  }

  function clearError() {
    if (errorEl) { errorEl.textContent = ''; errorEl.hidden = true; }
    if (input) input.classList.remove('err');
  }

  function resetEye() {
    if (!input) return;
    input.type = 'password';
    if (eyeBtn) {
      eyeBtn.textContent = '보기';
      eyeBtn.setAttribute('aria-label', '비밀번호 보기');
    }
  }

  /* the editor fits its canvas to the stage; it re-measures on window resize */
  function refitApp() {
    try {
      window.dispatchEvent(new Event('resize'));
      setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 180);
    } catch (e) { /* older browsers: nothing to re-fit */ }
  }

  function applyState() {
    var unlocked = isUnlocked();
    if (unlocked) root.classList.add('rp-unlocked');
    else root.classList.remove('rp-unlocked');

    resetEye();
    if (input) input.value = '';
    clearError();

    if (unlocked) { wrongCount = 0; refitApp(); }
    else setTimeout(focusInput, 40);
  }

  function showError(msg) {
    if (errorEl) { errorEl.textContent = msg; errorEl.hidden = false; }
    if (input) { input.value = ''; input.classList.add('err'); }
    if (form) {
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
      setTimeout(function () { if (form) form.classList.remove('shake'); }, 420);
    }
    focusInput();
  }

  function unlockNow() {
    saveUnlocked(true);
    applyState();
  }

  function lockNow() {
    saveUnlocked(false);
    applyState();
  }

  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (cooling) return;

      var value = input ? input.value : '';
      if (!normalize(value)) {
        showError('비밀번호를 입력해 주세요.');
        return;
      }
      if (verify(value)) {
        unlockNow();
        return;
      }

      wrongCount += 1;
      showError('비밀번호가 맞지 않습니다. 다시 확인해 주세요.');

      if (wrongCount >= 3) {
        cooling = true;
        var wait = Math.min(3000, (wrongCount - 2) * 800);
        if (submitBtn) submitBtn.disabled = true;
        if (errorEl) {
          errorEl.textContent = '비밀번호를 ' + wrongCount + '번 틀렸습니다. ' +
            (wait / 1000).toFixed(1) + '초 후 다시 시도해 주세요.';
          errorEl.hidden = false;
        }
        setTimeout(function () {
          cooling = false;
          if (submitBtn) submitBtn.disabled = false;
          focusInput();
        }, wait);
      }
    });
  }

  if (eyeBtn) {
    eyeBtn.addEventListener('click', function () {
      if (!input) return;
      var reveal = input.type === 'password';
      input.type = reveal ? 'text' : 'password';
      eyeBtn.textContent = reveal ? '숨기기' : '보기';
      eyeBtn.setAttribute('aria-label', reveal ? '비밀번호 숨기기' : '비밀번호 보기');
      focusInput();
    });
  }

  applyState();

  /* hook so the lock can be checked from automation */
  window.CARDNEWS_LOCK = {
    hash: sha256Hex,
    verify: verify,
    isUnlocked: isUnlocked,
    unlock: function () { unlockNow(); },
    lock: function () { lockNow(); }
  };
})();
