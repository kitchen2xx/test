<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드뉴스 스튜디오 · 칸바식 수동 편집 카드뉴스 발행기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Hahmlet:wght@300;400;600;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@300;400;600;900&family=Song+Myung&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
@font-face{font-family:'Nanum Pen Script';src:url('./fonts/NanumPenScript-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Gaegu';src:url('./fonts/Gaegu-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Gaegu';src:url('./fonts/Gaegu-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Gaegu Bold';src:url('./fonts/Gaegu-Bold.ttf') format('truetype');font-weight:400 900;font-style:normal;font-display:swap}
:root{
  --stage:#ECEDEF;
  --panel:#FFFFFF;
  --line:#E4E6EA;
  --line-2:#D2D6DD;
  --ink:#14171C;
  --ink-2:#5A626E;
  --ink-3:#8B929D;
  --soft:#F5F6F8;
  --soft-2:#EEF0F3;
  --accent:#1F7A55;
  --sel:#5B5BF5;
  --danger:#D2452F;
  --ui:'Pretendard Variable','Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --sh1:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --sh2:0 8px 24px rgba(16,24,40,.10);
  --sh3:0 18px 50px rgba(15,23,42,.16),0 2px 8px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--ui);color:var(--ink);background:var(--stage);-webkit-font-smoothing:antialiased;font-size:13px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:12.5px;color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#C9CDD4;border-radius:8px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#AEB4BE;background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%}
#topbar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:40}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,#17301F,#2E7D5B);display:flex;align-items:center;justify-content:center;color:#F2F7EE;font-size:15px;font-weight:800;box-shadow:0 4px 10px rgba(23,48,31,.25)}
.btext{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bname{font-size:13px;font-weight:800;letter-spacing:-.2px}
.ptitle{border:0;background:transparent;padding:1px 2px;margin-left:-2px;font-size:11.5px;color:var(--ink-3);width:170px;border-radius:4px}
.ptitle:hover{background:var(--soft)}
.ptitle:focus{outline:none;background:var(--soft);color:var(--ink)}
.seg{display:flex;background:var(--soft-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 11px;font-size:11.5px;font-weight:600;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;line-height:1.15;transition:.12s}
.seg button small{font-size:9px;font-weight:500;color:var(--ink-3);letter-spacing:.2px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh1)}
.seg button.on small{color:var(--accent)}
.topspacer{flex:1}
.topactions{display:flex;align-items:center;gap:6px}
.btn{height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--soft);border-color:var(--line-2)}
.btn:active{transform:translateY(.5px)}
.btn.icon{width:32px;padding:0;justify-content:center;font-size:15px;color:var(--ink-2)}
.btn.primary{background:#15181D;border-color:#15181D;color:#fff}
.btn.primary:hover{background:#262B33;border-color:#262B33}
.btn.subtle{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.subtle:hover{background:var(--soft)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn.small{height:28px;padding:0 9px;font-size:11.5px;border-radius:7px}
.btn.danger{color:var(--danger)}
.split{display:flex;margin-left:2px}
.split .btn.primary{border-radius:8px 0 0 8px}
.split .btn.primary.caret{border-radius:0 8px 8px 0;border-left:1px solid rgba(255,255,255,.18);width:28px;padding:0}
.vr{width:1px;height:22px;background:var(--line);margin:0 4px}

main{flex:1;display:flex;min-height:0}

/* ---------- slides panel ---------- */
#slidesPanel{width:202px;flex:0 0 202px;background:#FBFBFC;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel-h{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.count{background:var(--soft-2);color:var(--ink-2);border-radius:20px;padding:2px 7px;font-size:10.5px;font-weight:700;letter-spacing:0}
.thumbs{flex:1;overflow-y:auto;padding:2px 14px 12px;display:flex;flex-direction:column;gap:10px}
.thumb{position:relative;border-radius:9px;cursor:pointer;padding:5px;border:1.5px solid transparent;transition:.12s}
.thumb:hover{background:#F1F3F5}
.thumb.is-active{border-color:var(--sel);background:#F2F2FF;box-shadow:0 0 0 3px rgba(91,91,245,.08)}
.thumb-box{position:relative;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(16,24,40,.10);border-radius:2px}
.thumb-inner{position:absolute;left:0;top:0;transform-origin:top left}
.thumb .num{position:absolute;left:9px;bottom:9px;background:rgba(20,23,28,.72);color:#fff;font-size:9.5px;font-weight:700;border-radius:20px;padding:1px 6px;letter-spacing:.02em}
.thumb .del{position:absolute;right:9px;top:9px;width:19px;height:19px;border-radius:6px;border:0;background:rgba(20,23,28,.66);color:#fff;font-size:11px;line-height:1;display:none;align-items:center;justify-content:center}
.thumb:hover .del{display:flex}
.thumb .del:hover{background:var(--danger)}
.thumb-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 14px;border-top:1px solid var(--line)}
.thumb-actions button{height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:12px;display:flex;align-items:center;justify-content:center}
.thumb-actions button:hover{background:var(--soft);color:var(--ink)}
.add-slide{margin:0 14px 12px;height:34px;border-radius:8px;border:1px dashed var(--line-2);background:#fff;color:var(--ink-2);font-weight:700;font-size:12px}
.add-slide:hover{border-color:var(--accent);color:var(--accent);background:#F6FBF8}

/* ---------- stage ---------- */
#stageCol{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--stage)}
#addBar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:4px;padding:0 14px;background:rgba(255,255,255,.85);border-bottom:1px solid var(--line);backdrop-filter:blur(6px);z-index:5}
.tool{height:34px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);transition:.12s}
.tool:hover{background:#fff;border-color:var(--line);color:var(--ink);box-shadow:var(--sh1)}
.tool svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.toolbar-hint{margin-left:auto;font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
kbd{font-family:inherit;font-size:10px;background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 4px;color:var(--ink-2)}
#stageScroll{flex:1;overflow:auto;display:flex;padding:38px 40px 60px}
#stageWrap{margin:auto;flex:0 0 auto}
#stageInner{position:relative;background:#fff;box-shadow:var(--sh3);transform-origin:top left;will-change:transform}
#bgLayer{position:absolute;inset:0;overflow:hidden}
.bg-base,.bg-img,.bg-ov{position:absolute;inset:0}
.bg-img{background-size:cover;background-position:center;background-repeat:no-repeat}
#elsLayer{position:absolute;inset:0}
#guides{position:absolute;inset:0;pointer-events:none;display:none}
#guides.on{display:block}
#guides i{position:absolute;background:#FF2E7E;opacity:.9}
#guides .gx{top:0;bottom:0;width:1px}
#guides .gy{left:0;right:0;height:1px}

.el{position:absolute;box-sizing:border-box;user-select:none}
.el-text{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.el.is-editing{outline:none;cursor:text;user-select:text}
.el-img{overflow:hidden}
.el-img img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}

#selBox{position:absolute;border:1.5px solid var(--sel);box-sizing:border-box;pointer-events:none;display:none;z-index:999}
#selBox.on{display:block}
#selBox .h{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid var(--sel);border-radius:2px;pointer-events:auto;box-sizing:border-box}
.h-nw{left:-6px;top:-6px;cursor:nwse-resize}
.h-n{left:calc(50% - 5.5px);top:-6px;cursor:ns-resize}
.h-ne{right:-6px;top:-6px;cursor:nesw-resize}
.h-e{right:-6px;top:calc(50% - 5.5px);cursor:ew-resize}
.h-se{right:-6px;bottom:-6px;cursor:nwse-resize}
.h-s{left:calc(50% - 5.5px);bottom:-6px;cursor:ns-resize}
.h-sw{left:-6px;bottom:-6px;cursor:nesw-resize}
.h-w{left:-6px;top:calc(50% - 5.5px);cursor:ew-resize}
#selBox .tag{position:absolute;left:-1.5px;top:-22px;background:var(--sel);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px 4px 4px 0;white-space:nowrap;letter-spacing:.02em}

#zoomBar{position:absolute;right:18px;bottom:16px;height:34px;display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 5px;box-shadow:var(--sh2);z-index:6}
#zoomBar button{width:26px;height:26px;border:0;background:transparent;border-radius:6px;color:var(--ink-2);font-size:14px;display:flex;align-items:center;justify-content:center}
#zoomBar button:hover{background:var(--soft);color:var(--ink)}
#zoomVal{min-width:44px;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
#zoomBar .fit{width:auto;padding:0 8px;font-size:11px;font-weight:700}

/* ---------- props ---------- */
#propsPanel{width:324px;flex:0 0 324px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:32px;border:0;background:transparent;border-radius:8px 8px 0 0;font-size:12px;font-weight:700;color:var(--ink-3);position:relative}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink)}
.tabs button.on:after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
#propsBody{flex:1;overflow-y:auto;padding:12px 14px 40px}
.sect{margin-bottom:18px}
.sect-h{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--ink-3);text-transform:uppercase;margin:2px 0 9px;display:flex;align-items:center;justify-content:space-between}
.ctrl{margin-bottom:10px}
.ctl-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.ctl-h .val{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.row .lbl{font-size:11.5px;color:var(--ink-2);font-weight:600}
input[type=range]{-webkit-appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#E3E6EB;border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink);margin-top:-5px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
input[type=range]:focus{outline:none}
select,input[type=text],input[type=number],textarea{width:100%;height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 8px;outline:none}
select:focus,input[type=text]:focus,input[type=number]:focus,textarea:focus{border-color:var(--ink-3)}
textarea{padding:8px;height:auto;resize:vertical;line-height:1.5}
input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
.segbtns{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segbtns button{flex:1;height:28px;border:0;background:#fff;font-size:11.5px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:4px}
.segbtns button:last-child{border-right:0}
.segbtns button:hover{background:var(--soft)}
.segbtns button.on{background:var(--ink);color:#fff}
.segbtns button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .ctrl{margin:0}
.mini{font-size:11px;color:var(--ink-3);line-height:1.5;margin:6px 0 0}
.actrow{display:flex;gap:4px}
.actrow .btn{flex:1;justify-content:center;padding:0 6px}
.empty{padding:26px 8px;text-align:center;color:var(--ink-3);font-size:11.5px;line-height:1.7}
.empty b{display:block;color:var(--ink-2);font-size:12.5px;margin-bottom:4px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{border:1.5px solid var(--line);border-radius:10px;padding:8px;background:#fff;text-align:left;transition:.12s}
.preset:hover{border-color:var(--line-2);box-shadow:var(--sh1)}
.preset.on{border-color:var(--sel);box-shadow:0 0 0 3px rgba(91,91,245,.1)}
.preset .sw{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-bottom:6px}
.preset .sw i{flex:1}
.preset .nm{font-size:11px;font-weight:700;color:var(--ink);letter-spacing:-.1px}
.fontrow{display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:6px;text-align:left;cursor:pointer}
.fontrow:hover{border-color:var(--line-2);background:var(--soft)}
.fontrow.on{border-color:var(--sel);box-shadow:0 0 0 3px rgba(91,91,245,.08)}
.fontrow .fname{font-size:11px;color:var(--ink-3);width:78px;flex:0 0 78px;font-family:var(--ui);letter-spacing:0}
.fontrow .fprev{font-size:17px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.fontrow .x{border:0;background:transparent;color:var(--ink-3);font-size:13px;padding:2px 4px;border-radius:4px}
.fontrow .x:hover{background:#FDEAE6;color:var(--danger)}
.upload{border:1px dashed var(--line-2);border-radius:9px;padding:14px;text-align:center;background:#FCFCFD;cursor:pointer;transition:.12s}
.upload:hover{border-color:var(--accent);background:#F6FBF8}
.upload b{display:block;font-size:12px;margin-bottom:3px}
.upload span{font-size:10.5px;color:var(--ink-3)}
.badge-lbl{font-size:9.5px;font-weight:800;letter-spacing:.05em;color:#fff;background:var(--accent);border-radius:4px;padding:1px 5px}

/* ---------- modal / toast ---------- */
#modalRoot{position:fixed;inset:0;display:none;z-index:200}
#modalRoot.on{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(14,18,24,.44);backdrop-filter:blur(2px)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;box-shadow:0 30px 80px rgba(10,16,25,.35);width:min(760px,calc(100vw - 48px));max-height:calc(100vh - 80px);display:flex;flex-direction:column;overflow:hidden}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:14px;font-weight:800;letter-spacing:-.2px}
.modal-h .x{border:0;background:var(--soft);width:28px;height:28px;border-radius:8px;font-size:14px;color:var(--ink-2)}
.modal-h .x:hover{background:var(--soft-2)}
.modal-b{padding:16px 18px;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#FCFCFD}
.json-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.json-h{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase;margin-bottom:6px}
.ta{height:250px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;line-height:1.5;background:#FBFBFC}
.json-row{display:flex;gap:6px;margin-top:8px}
.json-row .btn{flex:1;justify-content:center}
.muted{font-size:11px;color:var(--ink-3);line-height:1.55;margin:0 0 8px}
.json-foot{display:flex;gap:8px;justify-content:flex-start;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.help-grid h4{margin:0 0 8px;font-size:12px;font-weight:800}
.klist{display:flex;flex-direction:column;gap:6px}
.klist div{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2)}
.klist b{font-weight:600;color:var(--ink)}
.help-grid ol,.help-grid ul{margin:0;padding-left:16px;font-size:11.5px;line-height:1.85;color:var(--ink-2)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#15181D;color:#fff;font-size:12px;font-weight:600;padding:10px 16px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.22s;z-index:300;max-width:70vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#A32B1B}
#busy{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.7);z-index:250;backdrop-filter:blur(2px)}
#busy.on{display:flex}
#busy .box{background:#15181D;color:#fff;padding:16px 22px;border-radius:12px;font-size:12.5px;font-weight:600;box-shadow:var(--sh3);display:flex;align-items:center;gap:10px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
<style id="rpLockStyle">
  /* ============================================================
     잠금 화면 (확인 링크용)
     비밀번호는 여기에 적지 않습니다. SHA-256 다이제스트만 두고
     순수 JS로 대조해 https://와 file://에서 똑같이 동작합니다.
     앱은 display:none 대신 visibility로 가려 레이아웃·캔버스 치수를
     그대로 유지합니다(잠금 해제 후 화면이 어긋나지 않도록).
     ============================================================ */
  #lockScreen{display:none}
  html:not(.rp-unlocked) #lockScreen{
    display:flex;position:fixed;inset:0;z-index:2147483000;
    align-items:center;justify-content:center;overflow:auto;
    padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
    background:radial-gradient(900px 540px at 50% -12%,#F4F6F3 0%,#E7ECE7 46%,#D9DFDA 100%);
    font-family:var(--ui);-webkit-text-size-adjust:100%;
  }
  html:not(.rp-unlocked) body > *:not(#lockScreen){visibility:hidden !important}
  html:not(.rp-unlocked){overflow:hidden !important}
  .rp-lock-card{
    width:100%;max-width:392px;margin:auto;color:var(--ink);text-align:center;
    background:var(--panel);border-radius:20px;
    box-shadow:0 26px 70px rgba(15,23,42,.22),0 2px 8px rgba(15,23,42,.06);
    padding:30px 24px 22px;
  }
  .rp-lock-card.shake{animation:rpLockShake .36s ease-in-out}
  .rp-lock-icon{
    width:54px;height:54px;margin:0 auto 15px;border-radius:16px;color:#F2F7EE;
    background:linear-gradient(150deg,#17301F,#2E7D5B);
    box-shadow:0 12px 26px rgba(23,48,31,.28);
    display:flex;align-items:center;justify-content:center;font-size:24px;
  }
  .rp-lock-title{font-size:17px;font-weight:800;margin:0;letter-spacing:-.3px;color:var(--ink)}
  .rp-lock-sub{font-size:12.5px;color:var(--ink-2);margin:6px 0 18px;line-height:1.55}
  .rp-lock-field{position:relative}
  .rp-lock-field input{
    width:100%;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.35em;text-align:center;
    color:var(--ink);background:var(--soft);border:1px solid var(--line-2);border-radius:12px;
    padding:12px 52px;outline:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .rp-lock-field input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(31,122,85,.15)}
  .rp-lock-field input.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(210,69,47,.15)}
  .rp-lock-field input::placeholder{letter-spacing:.3em;font-weight:400;color:#A6ADB8}
  .rp-lock-eye{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;
    cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:800;color:var(--ink-2);
    padding:7px 9px;border-radius:8px;white-space:nowrap;
  }
  .rp-lock-eye:hover{background:var(--soft-2);color:var(--ink)}
  .rp-lock-error{margin:10px 0 0;font-size:12.5px;font-weight:700;color:#C0392B;line-height:1.5}
  .rp-lock-error[hidden]{display:none}
  .rp-lock-submit{
    margin-top:14px;width:100%;border:0;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,#2E7D5B,#1F7A55);color:#fff;font-family:inherit;
    font-size:14px;font-weight:800;padding:12px 14px;
  }
  .rp-lock-submit:hover{filter:brightness(1.06)}
  .rp-lock-submit:disabled{opacity:.55}
  .rp-lock-foot{font-size:11.5px;color:var(--ink-3);margin:14px 0 0;line-height:1.55}
  @keyframes rpLockShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  @media (max-height:580px){
    .rp-lock-card{padding:22px 20px 18px}
    .rp-lock-icon{width:46px;height:46px;font-size:20px;margin-bottom:10px}
    .rp-lock-sub{margin-bottom:14px}
  }
</style>
<style id="cnV2Style">
  /* ============================================================
     v2 · AI 프롬프트/이미지 생성 패널 · 이미지 확대·이동 · 모바일 탭 레이아웃
     기존 잠금 스타일(rpLockStyle)은 그대로 두고 여기서만 확장합니다.
     ============================================================ */
  #btnMore{display:none}
  #mobileBar{
    display:none;height:54px;flex:0 0 54px;background:var(--panel);
    border-top:1px solid var(--line);align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom);z-index:30;
  }
  #mobileBar button{
    flex:1;border:0;background:transparent;border-radius:11px;margin:5px 3px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-family:inherit;font-size:10.5px;font-weight:700;color:var(--ink-3);
  }
  #mobileBar button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #mobileBar button.on{background:var(--soft-2);color:var(--ink)}

  /* 도구 막대가 줄바꿈되지 않게 */

  /* AI 패널 */
  .ai-field{display:block;margin-bottom:10px}
  .ai-field>span{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
  .ai-prompt{
    width:100%;min-height:158px;margin-top:2px;resize:vertical;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px;line-height:1.6;background:#FBFBFC;border:1px solid var(--line);
    border-radius:9px;padding:9px 10px;color:var(--ink-2);
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 10px;
    font-family:inherit;font-size:11px;font-weight:600;color:var(--ink-2);
    display:inline-flex;align-items:center;gap:5px;
  }
  .chip i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .chip:hover{border-color:var(--line-2);color:var(--ink)}
  .chip.on{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 2px rgba(20,23,28,.07)}
  .dz{
    border:1.5px dashed var(--line-2);border-radius:11px;padding:15px 12px;text-align:center;
    background:#FCFCFD;cursor:pointer;transition:.12s;
  }
  .dz:hover,.dz.over{border-color:var(--accent);background:#F6FBF8}
  .dz b{display:block;font-size:12px;margin-bottom:3px;color:var(--ink)}
  .dz span{font-size:10.5px;color:var(--ink-3);line-height:1.5}
  .ai-status{
    font-size:11px;line-height:1.6;border-radius:8px;padding:8px 9px;margin:8px 0 0;
    background:var(--soft);color:var(--ink-2);white-space:pre-line;
  }
  .ai-status.ok{background:#EDF7F0;color:#1F7A55}
  .ai-status.err{background:#FDEDEA;color:#A32B1B}
  .keyrow{display:flex;gap:6px}
  .keyrow input{flex:1;min-width:0}
  .keyrow .btn{flex:0 0 auto;height:30px}
  .badge-lbl.gray{background:#EEF0F3;color:var(--ink-2)}
  .badge-lbl.blue{background:#E9EDF7;color:#3A4A7A}

  /* ---------- 좁은 화면: 패널을 탭으로 전환 ---------- */
  @media (max-width:1080px){
    #topbar{height:52px;flex:0 0 52px;gap:8px;padding:0 10px}
    .brand{min-width:0;gap:8px}
    .brand .ptitle{display:none}
    .bname{font-size:12.5px}
    #btnUndo,#btnRedo,#btnHelp,#btnJson{display:none}
    .topactions .vr{display:none}
    #btnMore{display:inline-flex}
    #mobileBar{display:flex}
    #slidesPanel,#propsPanel{display:none}
    body.mv-slides #slidesPanel{display:flex;width:auto;flex:1 1 auto;border-right:0}
    body.mv-props #propsPanel{display:flex;width:auto;flex:1 1 auto;border-left:0}
    body.mv-slides #stageCol,body.mv-props #stageCol{display:none}
    #thumbs{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
      gap:12px;justify-items:center;align-content:start;padding:2px 12px 12px;
    }
    .thumb{width:100%;max-width:260px}
    #addBar{overflow-x:auto;overflow-y:hidden;padding:0 10px;gap:2px;scrollbar-width:none}
    #addBar::-webkit-scrollbar{display:none}
    .toolbar-hint{display:none}
    #stageScroll{padding:16px 12px 74px}
    #zoomBar{bottom:10px;right:10px}
    #propsBody{padding:12px 14px 40px;max-width:720px;width:100%;margin:0 auto}
    .tabs{padding:8px 8px 0}
    .tabs button{font-size:11.5px}
  }
  @media (max-width:520px){
    .btext{display:none}
    .seg button{padding:6px 9px}
    .seg button small{display:none}
    #btnExport{padding:0 9px;font-size:12px}
    #propsBody{max-width:none}
    .json-grid,.help-grid{grid-template-columns:1fr}
  }
</style>
<style id="cnV3Style">
  /* ============================================================
     v3 · 프로젝트 허브(메인) · 프로젝트별 설정 · 슬라이드 드래그 순서 변경
     v2 스타일은 그대로 두고 여기서만 확장합니다.
     ============================================================ */

  /* ---------- 상단 프로젝트 이동 ---------- */
  .navbtn{
    height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;
    color:var(--ink-2);font-family:inherit;font-size:12px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;padding:0 10px;white-space:nowrap;transition:.12s;
  }
  .navbtn:hover{background:var(--soft);color:var(--ink);border-color:var(--line-2)}
  .navbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- 프로젝트 허브 ---------- */
  #hub{
    position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;overflow:hidden;
    background:radial-gradient(1200px 620px at 10% -12%,#F8FAF6 0%,#EDF0EB 52%,#E3E7E2 100%);
  }
  #hub[hidden]{display:none}
  #hubTop{
    flex:0 0 64px;display:flex;align-items:center;gap:11px;padding:0 22px;
    background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px);z-index:2;
  }
  .hub-brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  .hub-brand .hname{font-size:14px;font-weight:800;letter-spacing:-.3px}
  .hub-brand .hsub{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.2px}
  #hubBody{flex:1;overflow:auto;padding:26px 22px 64px;-webkit-overflow-scrolling:touch}
  .hub-wrap{max-width:1240px;margin:0 auto}
  .hub-head{display:flex;align-items:flex-end;gap:10px;margin:0 0 16px}
  .hub-head h1{font-size:20px;margin:0;letter-spacing:-.5px}
  .hub-head .cnt{font-size:12px;font-weight:700;color:var(--ink-3);padding-bottom:3px}
  .pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:18px}
  .pj-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;
    box-shadow:var(--sh1);display:flex;flex-direction:column;gap:8px;transition:.14s;
  }
  .pj-card:hover{box-shadow:var(--sh2);border-color:var(--line-2);transform:translateY(-1px)}
  .pj-prev{
    position:relative;border-radius:9px;overflow:hidden;background:var(--soft-2);
    display:flex;align-items:center;justify-content:center;padding:8px 0;height:206px;cursor:pointer;
  }
  .pj-thumb{position:relative;overflow:hidden;background:#fff;box-shadow:0 3px 12px rgba(16,24,40,.12);border-radius:2px;flex:0 0 auto}
  .pj-thumb-inner{position:absolute;left:0;top:0;transform-origin:top left}
  .pj-name{
    font-size:13px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;cursor:pointer;padding:0 2px;
  }
  .pj-name:hover{color:var(--accent)}
  .pj-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:10.5px;font-weight:600;color:var(--ink-3);padding:0 2px}
  .pj-meta .tag{background:var(--soft);border-radius:5px;padding:1px 5px;color:var(--ink-2)}
  .pj-acts{display:flex;gap:5px;margin-top:auto;padding-top:2px}
  .pj-acts .open{flex:1;justify-content:center}
  .pj-acts svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .pj-new{
    border:1.5px dashed var(--line-2);background:rgba(255,255,255,.55);border-radius:14px;
    min-height:216px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    color:var(--ink-2);font-family:inherit;font-size:12.5px;font-weight:700;transition:.14s;
  }
  .pj-new:hover{border-color:var(--accent);color:var(--accent);background:#F7FCF9}
  .pj-new .plus{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--ink-2);line-height:1}
  .pj-new:hover .plus{border-color:var(--accent);color:var(--accent)}
  .hub-foot{margin-top:26px;font-size:11.5px;color:var(--ink-3);line-height:1.75}
  .hub-foot b{color:var(--ink-2)}

  /* ---------- 프로젝트 설정 모달 ---------- */
  .set-wrap{display:flex;flex-direction:column;gap:15px}
  .set-lbl{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
  .set-input{
    width:100%;height:38px;border:1px solid var(--line-2);border-radius:9px;
    padding:0 11px;font-size:13px;background:#fff;
  }
  .set-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,122,85,.13)}
  .fmt-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .fmt-pick button{
    height:54px;border:1.5px solid var(--line);border-radius:10px;background:#fff;
    font-family:inherit;font-size:12px;font-weight:700;color:var(--ink-2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.12s;
  }
  .fmt-pick button small{font-size:9.5px;font-weight:600;color:var(--ink-3)}
  .fmt-pick button:hover{border-color:var(--line-2);color:var(--ink)}
  .fmt-pick button.on{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 2px rgba(20,23,28,.06)}
  .theme-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .theme-pick button{
    border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:8px 4px;
    display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit;
    font-size:10.5px;font-weight:700;color:var(--ink-2);transition:.12s;
  }
  .theme-pick .sw{display:flex;gap:2px}
  .theme-pick .sw i{width:9px;height:15px;border-radius:2px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
  .theme-pick button:hover{border-color:var(--line-2);color:var(--ink)}
  .theme-pick button.on{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 2px rgba(20,23,28,.06)}
  .set-check{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;line-height:1.55;color:var(--ink-2);cursor:pointer}
  .set-check input{width:14px;height:14px;margin-top:1px;accent-color:#15181D;flex:0 0 auto}

  /* ---------- 슬라이드 끌어서 순서 변경 ---------- */
  #thumbs{position:relative;touch-action:pan-y}
  .thumb{cursor:grab}
  .thumb:active{cursor:grabbing}
  .thumb .grip{
    position:absolute;right:9px;bottom:8px;display:none;line-height:16px;padding:0 4px;
    border-radius:6px;background:rgba(20,23,28,.5);color:#fff;font-size:10.5px;letter-spacing:1px;
  }
  .thumb:hover .grip,.thumb.is-grip .grip{display:block}
  .thumb.is-drag-src{display:none}
  .thumb-ph{
    border-radius:9px;border:1.6px dashed var(--sel);background:#F3F3FF;flex:0 0 auto;
    box-sizing:border-box;
  }
  .thumb-ghost{
    position:fixed;z-index:900;margin:0;pointer-events:none;opacity:.97;border-radius:9px;
    padding:5px;background:#fff;border:1.5px solid var(--sel);box-shadow:0 16px 38px rgba(15,23,42,.26);
    box-sizing:border-box;
  }
  body.thumb-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

  @media (max-width:1080px){
    #hubTop{flex:0 0 56px;padding:0 12px;gap:8px}
    #hubBody{padding:18px 12px 44px}
    .pj-grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
    .pj-card{padding:8px;border-radius:12px}
    .pj-prev{height:166px}
    .pj-new{min-height:170px}
    .hub-head h1{font-size:17px}
    #btnHub,#btnProjSet{display:none}
  }
  @media (max-width:520px){
    .pj-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .pj-meta{font-size:10px}
    .fmt-pick,.theme-pick{grid-template-columns:repeat(2,1fr)}
    #hubSample{display:none}
    #hubTop .navbtn{font-size:11.5px;padding:0 9px}
  }
</style>
</head>
<body>
<div id="lockScreen" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <form class="rp-lock-card" id="lockForm" autocomplete="off" novalidate>
    <div class="rp-lock-icon" aria-hidden="true">▦</div>
    <h1 class="rp-lock-title" id="lockTitle">카드뉴스 스튜디오</h1>
    <p class="rp-lock-sub">비밀번호를 입력해 주세요.</p>
    <div class="rp-lock-field">
      <input type="password" id="lockInput" inputmode="numeric" autocomplete="off"
             autocapitalize="off" spellcheck="false" aria-label="비밀번호" placeholder="····">
      <button type="button" class="rp-lock-eye" id="lockEye" aria-label="비밀번호 보기">보기</button>
    </div>
    <p class="rp-lock-error" id="lockError" role="alert" hidden></p>
    <button type="submit" class="rp-lock-submit" id="lockSubmit">잠금 해제</button>
    <noscript><p class="rp-lock-error">자바스크립트가 꺼져 있어 잠금을 해제할 수 없습니다.</p></noscript>
    <p class="rp-lock-foot">잠금은 이 탭에서만 유지됩니다. 탭을 닫으면 다시 잠깁니다.</p>
  </form>
</div>

<div id="hub" hidden>
  <header id="hubTop">
    <div class="logo">▦</div>
    <div class="hub-brand">
      <div class="hname">카드뉴스 스튜디오</div>
      <div class="hsub">프로젝트</div>
    </div>
    <div class="topspacer"></div>
    <button class="navbtn" id="hubSample" title="예시 카드뉴스 3장으로 새 프로젝트 만들기">예시로 시작</button>
    <button class="btn primary" id="hubNew">＋ 새 프로젝트</button>
  </header>
  <div id="hubBody">
    <div class="hub-wrap">
      <div class="hub-head">
        <h1>내 프로젝트</h1>
        <span class="cnt" id="hubCount"></span>
      </div>
      <div class="pj-grid" id="pjGrid"></div>
      <p class="hub-foot">프로젝트는 이 브라우저에 자동 저장됩니다. 다른 기기로 옮기거나 백업하려면 작업 화면의 <b>JSON</b> 버튼으로 내보내세요.<br>작업 화면 왼쪽의 슬라이드 카드를 위아래로 끌면 페이지 순서가 바뀝니다(모바일은 카드를 잠시 길게 누른 뒤 끌기).</p>
    </div>
  </div>
</div>

<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="logo">▦</div>
      <div class="btext">
        <div class="bname">카드뉴스 스튜디오</div>
        <input id="projTitle" class="ptitle" value="나의 카드뉴스" spellcheck="false" aria-label="프로젝트 이름">
      </div>
    </div>
    <div class="seg" id="fmtSeg" aria-label="캔버스 비율">
      <button data-fmt="1:1">1:1<small>1080×1080</small></button>
      <button data-fmt="4:5">4:5<small>1080×1350</small></button>
      <button data-fmt="9:16">9:16<small>1080×1920</small></button>

}

  n.style.top = (el.y || 0) + 'px';

  n.style.opacity = el.opacity == null ? 1 : el.opacity;

  if (el.type === 'text') {

    im.style.transformOrigin = 'center center';
    im.style.transform = 'translate(' + (el.ox || 0) + '%,' + (el.oy || 0) + '%) scale(' + (el.zoom == null ? 1 : el.zoom) + ')';
    n.appendChild(im);
  } else {
    n.classList.add('el-shape');
    n.style.height = Math.max(1, el.h || 1) + 'px';
    n.style.background = (el.fill && el.fill !== 'transparent') ? el.fill : 'transparent';
    n.style.borderRadius = el.shape === 'ellipse' ? '50%' : (el.radius || 0) + 'px';
    if (el.stroke && el.strokeWidth > 0) n.style.border = el.strokeWidth + 'px solid ' + el.stroke;
    if (el.shadow) n.style.boxShadow = '0 12px 34px rgba(12,18,28,.22)';
  }

  if (!interactive) { n.style.pointerEvents = 'none'; return n; }

  n.addEventListener('pointerdown', e => {
    if (state.editing) return;
    if (e.button !== 0) return;
    e.stopPropagation();
    if (state.selId !== el.id) { state.selId = el.id; state.tab = 'el'; renderSel(); renderProps(); }
    startDrag(e, el, 'move');
  });
  n.addEventListener('dblclick', e => {
    if (el.type !== 'text') return;
    e.stopPropagation();

  });

}

let _measureRAF = 0;

function applyZoom() {

  const z = state.zoom;

  dom.stageWrap.style.width = (f.w * z) + 'px';
  dom.stageWrap.style.height = (f.h * z) + 'px';

}
function fitZoom() {
  const pad = 92;
  const aw = dom.stageScroll.clientWidth - pad;

/* =========================================================================
   히스토리
   ========================================================================= */
function snapshot() {
  return JSON.stringify({ app: 'cardnews-studio', version: 1, title: state.project.title, format: state.project.format, slides: state.project.slides });
}
function resetHistory() {
  state.history = [snapshot()];
  state.hp = 0;
  updateTop();
}
function pushHistory() {
  const s = snapshot();
  if (state.history[state.hp] === s) return;
  state.history = state.history.slice(0, state.hp + 1);
  state.history.push(s);
  if (state.history.length > 70) state.history.shift();
  state.hp = state.history.length - 1;
  updateTop();
}
function restore(json) {
  const d = JSON.parse(json);
  state.project.title = d.title;
  state.project.format = d.format;
  state.project.slides = d.slides;
  state.slideIndex = clamp(state.slideIndex, 0, state.project.slides.length - 1);
  state.selId = null;
  state.editing = null;
  renderAll();
  scheduleSave();
}
function undo() {
  if (state.hp <= 0) return;
  state.hp--; restore(state.history[state.hp]); toast('실행취소');
}
function redo() {
  if (state.hp >= state.history.length - 1) return;
  state.hp++; restore(state.history[state.hp]); toast('다시실행');
}

/* =========================================================================
   선택 · 드래그 · 리사이즈
   ========================================================================= */
function toLogical(ev) {
  const r = dom.stageInner.getBoundingClientRect();
  const z = state.zoom;
  return { x: (ev.clientX - r.left) / z, y: (ev.clientY - r.top) / z };
}

function moveListeners(on, handlers) {
  const move = handlers.move, up = handlers.up;
  if (on) {
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  } else {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
  }
}

function startDrag(e, el, mode, dir) {
  const p0 = toLogical(e);
  const st = {
    el, mode, dir: dir || 'move',
    p0,
    x0: el.x, y0: el.y, w0: el.w, h0: el.h, size0: el.size, lh0: el.lh,
    moved: false,
    others: curSlide().els.filter(x => x.id !== el.id).map(x => ({ x: x.x, y: x.y, w: x.w, h: x.h }))
  };
  state.drag = st;
  const node = dom.elsLayer.querySelector('[data-id="' + el.id + '"]');

  const onMove = ev => {
    const p = toLogical(ev);
    const dx = p.x - st.p0.x, dy = p.y - st.p0.y;
    if (!st.moved && Math.abs(dx) + Math.abs(dy) < 2) return;
    st.moved = true;

    if (st.mode === 'move') {
      let nx = st.x0 + dx, ny = st.y0 + dy;
      if (!ev.shiftKey) {
        const sn = snapMove(el, nx, ny, st.others);
        nx = sn.x; ny = sn.y;
        showGuides(sn.gx, sn.gy);
      } else hideGuides();
      el.x = Math.round(nx); el.y = Math.round(ny);
      node.style.left = el.x + 'px'; node.style.top = el.y + 'px';
      renderSel();
    } else {
      resizeEl(el, st, dx, dy, ev.shiftKey);
      node.style.left = el.x + 'px'; node.style.top = el.y + 'px';
      node.style.width = el.w + 'px';
      if (el.type !== 'text') node.style.height = el.h + 'px';
      if (el.type === 'text') {
        node.style.fontSize = el.size + 'px';
        el.h = node.offsetHeight;
      }
      renderSel();
    }
  };
  const onUp = () => {
    moveListeners(false, { move: onMove, up: onUp });
    hideGuides();
    if (st.moved) { pushHistory(); if (stoneOf(el)) renderStage(); renderProps(); renderThumbsSoon(); scheduleSave(); }
    state.drag = null;
  };
  moveListeners(true, { move: onMove, up: onUp });
}

function resizeEl(el, st, dx, dy, shift) {
  const d = st.dir;
  const min = 16;
  let x = st.x0, y = st.y0, w = st.w0, h = st.h0;

  if (el.type === 'text') {
    if (d === 'w' || d === 'e') {
      if (d === 'e') w = Math.max(60, st.w0 + dx);
      else { w = Math.max(60, st.w0 - dx); x = st.x0 + (st.w0 - w); }
    } else {
      // 모서리 = 글자 크기 비례 확대/축소
      const signX = d.includes('e') ? 1 : -1;
      const rawF = (st.w0 + signX * dx) / Math.max(1, st.w0);
      const f = clamp(rawF, .15, 8);
      w = Math.max(60, st.w0 * f);
      if (d.includes('w')) x = st.x0 + st.w0 - w;
      el.size = clamp(Math.round(st.size0 * f), 6, 400);
      el.w = w; el.x = Math.round(x);
      el.lh = st.lh0;
      return;
    }
    el.w = Math.round(w); el.x = Math.round(x);
    return;
  }

  if (d.includes('e')) w = st.w0 + dx;
  if (d.includes('w')) { w = st.w0 - dx; x = st.x0 + dx; }
  if (d.includes('s')) h = st.h0 + dy;
  if (d.includes('n')) { h = st.h0 - dy; y = st.y0 + dy; }

  const lockAspect = (el.type === 'image' && el.lock) || shift;
  if (lockAspect && d.length === 2) {
    const aspect = st.w0 / Math.max(1, st.h0);
    let f = Math.abs(dx) > Math.abs(dy) ? (st.w0 + (d.includes('e') ? dx : -dx)) / st.w0
                                         : (st.h0 + (d.includes('s') ? dy : -dy)) / st.h0;
    f = clamp(f, .08, 12);
    w = st.w0 * f; h = st.h0 * f;
    x = d.includes('w') ? st.x0 + st.w0 - w : st.x0;
    y = d.includes('n') ? st.y0 + st.h0 - h : st.y0;
  }
  if (w < min) { if (d.includes('w')) x = st.x0 + st.w0 - min; w = min; }
  if (h < min) { if (d.includes('n')) y = st.y0 + st.h0 - min; h = min; }
  el.x = Math.round(x); el.y = Math.round(y);
  el.w = Math.round(w); el.h = Math.round(h);
}

const SNAP = 7;
function snapMove(el, x, y, others) {
  const f = fmt();
  const tol = SNAP;
  const vTargets = [0, f.w / 2, f.w];
  const hTargets = [0, f.h / 2, f.h];
  others.forEach(o => { vTargets.push(o.x, o.x + o.w / 2, o.x + o.w); hTargets.push(o.y, o.y + o.h / 2, o.y + o.h); });
  const anchorsX = [x, x + el.w / 2, x + el.w];
  const anchorsY = [y, y + el.h / 2, y + el.h];
  let bestX = null, bestY = null;
  anchorsX.forEach(a => vTargets.forEach(t => {
    const d = t - a; if (Math.abs(d) <= tol && (!bestX || Math.abs(d) < Math.abs(bestX.d))) bestX = { d, t };
  }));
  anchorsY.forEach(a => hTargets.forEach(t => {
    const d = t - a; if (Math.abs(d) <= tol && (!bestY || Math.abs(d) < Math.abs(bestY.d))) bestY = { d, t };
  }));
  return {
    x: bestX ? x + bestX.d : x,
    y: bestY ? y + bestY.d : y,
    gx: bestX ? bestX.t : null,
    gy: bestY ? bestY.t : null
  };
}
function showGuides(gx, gy) {
  const g = dom.guides;
  if (gx == null && gy == null) { g.classList.remove('on'); return; }
  g.classList.add('on');
  const lx = g.querySelector('.gx'), ly = g.querySelector('.gy');
  const t = (1 / state.zoom) + 'px';
  lx.style.display = gx == null ? 'none' : 'block';
  ly.style.display = gy == null ? 'none' : 'block';
  if (gx != null) { lx.style.left = gx + 'px'; lx.style.width = t; }
  if (gy != null) { ly.style.top = gy + 'px'; ly.style.height = t; }
}
function hideGuides() { dom.guides.classList.remove('on'); }

/* ---------------- 인라인 텍스트 편집 ---------------- */
function beginEdit(el) {
  if (el.type !== 'text') return;
  const n = dom.elsLayer.querySelector('[data-id="' + el.id + '"]');
  if (!n) return;
  if (stoneOf(el)) {
    // 편집하는 동안에는 큐빅 대신 실제 글자를 보여 줍니다 (끝나면 다시 큐빅으로)
    const cv = n.querySelector('.stone-img');
    if (cv) cv.remove();
    n.style.height = 'auto';
    n.style.overflow = 'visible';
    n.textContent = el.text == null ? '' : el.text;
  }
  state.editing = el.id;
  state.selId = el.id;
  n.contentEditable = 'true';
  n.spellcheck = false;
  n.classList.add('is-editing');
  n.focus();
  const range = document.createRange();
  range.selectNodeContents(n);
  const s = window.getSelection();
  s.removeAllRanges(); s.addRange(range);
  renderSel();
  const end = () => {
    n.removeEventListener('blur', end);
    if (state.editing !== el.id) return;
    const txt = n.innerText.replace(/\u00a0/g, ' ').replace(/\n$/, '');
    el.text = txt;
    state.editing = null;
    n.contentEditable = 'false';
    n.classList.remove('is-editing');
    pushHistory();
    renderStage(); renderThumbsSoon(); renderProps();
  };
  n.addEventListener('blur', end);
  n.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { ev.preventDefault(); n.blur(); }
    ev.stopPropagation();
  });
}

/* =========================================================================
   요소 추가/삭제
   ========================================================================= */
function themeInk() {
  const bg = curSlide().bg;
  if (bg.type === 'gradient') return '#FFFFFF';
  const c = (bg.color || '#ffffff').replace('#', '');
  if (c.length < 6) return '#14171C';
  const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) < 140 ? '#FFFFFF' : '#14171C';
}
function placeNew(w, h) {
  const f = fmt();
  const s = curSlide();
  const n = s.els.length;
  const off = (n % 6) * 24;
  return { x: Math.round((f.w - w) / 2 + off - 40), y: Math.round(f.h * 0.42 - h / 2 + off - 40) };
}

function addText(kind) {
  const s = curSlide();
  let el;
  if (kind === 'title') {
    el = textEl({ w: 840, size: 96, weight: 800, lh: 1.2, ls: -1.5, text: '제목을 입력하세요', font: state.theme === 'beige' ? 'Gowun Batang' : (state.theme === 'editorial' ? 'Noto Serif KR' : state.defaultFont) });
  } else if (kind === 'badge') {
    el = textEl({ w: 320, size: 24, weight: 700, ls: 4, text: 'BADGE', align: 'center', pad: 16, boxRadius: 100, boxColor: themeInk() === '#FFFFFF' ? '#F5F1E6' : '#17301F', color: themeInk() === '#FFFFFF' ? '#17301F' : '#F5F1E6' });
  } else {
    el = textEl({ w: 720, size: 40, weight: 400, lh: 1.55, text: '텍스트를 입력하세요', font: state.defaultFont });
  }
  if (el.color === '#14171C') el.color = themeInk();
  const p = placeNew(el.w, 90);
  el.x = p.x; el.y = p.y;
  s.els.push(el);
  state.selId = el.id; state.tab = 'el';
  pushHistory(); renderStage(); renderThumbsSoon(); renderProps();
  selectField('.props-textarea');
}
function addShape(kind) {
  const s = curSlide();
  const f = fmt();
  let el;
  if (kind === 'ellipse') el = shapeEl({ w: 320, h: 320, shape: 'ellipse', fill: '#3E6B4F' });
  else if (kind === 'line') el = shapeEl({ w: 620, h: 4, shape: 'rect', fill: themeInk() === '#FFFFFF' ? '#F5F1E6' : '#3E6B4F' });
  else if (kind === 'round') el = shapeEl({ w: 460, h: 300, shape: 'rect', radius: 40, fill: themeInk() === '#FFFFFF' ? '#F5F1E6' : '#DEE8D0' });
  else el = shapeEl({ w: 420, h: 300, shape: 'rect', fill: themeInk() === '#FFFFFF' ? '#F5F1E6' : '#DEE8D0' });
  if (kind !== 'ellipse' && themeInk() === '#FFFFFF' && kind !== 'line') el.fill = '#22303C';
  const p = placeNew(el.w, el.h);
  el.x = Math.round((f.w - el.w) / 2); el.y = p.y;

  state.selId = el.id; state.tab = 'el';
  pushHistory(); renderStage(); renderThumbsSoon(); renderProps();
  toast('도형을 추가했습니다. 속성 패널에서 색·모서리를 조절하세요.');
}
function deleteSel() {
  const el = selEl();
  if (!el) return;
  const s = curSlide();
  s.els = s.els.filter(x => x.id !== el.id);
  state.selId = null;
  pushHistory(); renderStage(); renderThumbsSoon(); renderProps();
  toast('삭제했습니다 · Ctrl+Z로 되돌릴 수 있어요');
}
function duplicateSel() {
  const el = selEl(); if (!el) return;
  const c = clone(el);
  c.id = uid(el.type[0]);
  c.x += 28; c.y += 28;
  curSlide().els.push(c);
  state.selId = c.id;
  pushHistory(); renderStage(); renderThumbsSoon(); renderProps();
}
function layerMove(where) {
  const el = selEl(); if (!el) return;
  const s = curSlide();
  const i = s.els.indexOf(el);
  s.els.splice(i, 1);
  if (where === 'front') s.els.push(el);
  else if (where === 'back') s.els.unshift(el);
  else if (where === 'forward') s.els.splice(Math.min(s.els.length, i + 1), 0, el);
  else s.els.splice(Math.max(0, i - 1), 0, el);
  pushHistory(); renderStage(); renderThumbsSoon(); renderProps();
}
function alignTo(kind) {
  const el = selEl(); if (!el) return;
  const f = fmt();
  if (kind === 'h' || kind === 'both') el.x = Math.round((f.w - el.w) / 2);
  if (kind === 'v' || kind === 'both') el.y = Math.round((f.h - (el.h || 60)) / 2);
  pushHistory(); renderStage(); renderThumbsSoon();
}

/* ---------------- 이미지 ---------------- */
const imgCache = new Map();
function getImage(src) {
  if (!src) return Promise.resolve(null);
  if (imgCache.has(src)) return imgCache.get(src);
  const p = new Promise(res => {
    const im = new Image();
    im.onload = () => res(im);

function readDataURL(file) {

}
async function insertImageFile(file, at) {

  if (!/^image\//.test(file.type) && !/\.(png|jpe?g|webp|svg)$/i.test(file.name)) { toast('이미지 파일만 넣을 수 있습니다.', true); return; }

  const im = await getImage(src);
  if (!im) { toast('이미지를 읽지 못했습니다.', true); return; }

  const maxW = f.w * 0.66, maxH = f.h * 0.5;
  let w = im.naturalWidth || 800, h = im.naturalHeight || 600;
  const sc = Math.min(1, maxW / w, maxH / h);
  w = Math.round(w * sc); h = Math.round(h * sc);
  const el = imageEl({ src, w, h });
  const p = at || { x: (f.w - w) / 2, y: (f.h - h) / 2 };
  el.x = Math.round(clamp(p.x - w / 2, 0, f.w - w));
  el.y = Math.round(clamp(p.y - h / 2, 0, f.h - h));

function applyPresetToSlide(s, p) {
  s.bg = Object.assign({}, clone(p.bg), { overlay: s.bg.overlay || 0, src: s.bg.src || '' });
  if (p.bg.type === 'gradient') s.bg.color = s.bg.color || '#111820';
  const texts = s.els.filter(e => e.type === 'text').slice().sort((a, b) => b.size - a.size);
  texts.forEach((e, i) => {
    const isBadge = e.boxColor && e.boxColor !== 'transparent' && e.pad > 4;
    if (isBadge) {
      e.boxColor = p.badgeBg;
      e.color = p.badgeText;
      return;
    }
    if (i === 0) { e.font = p.titleFont; e.color = p.titleColor; }
    else if (i === 1 && e.size >= 30) { e.font = p.bodyFont; e.color = p.subColor; }
    else { e.font = p.bodyFont; e.color = p.bodyColor; }
  });
  s.els.filter(e => e.type === 'shape').forEach(e => {
    const thin = (e.h || 0) <= 14 || (e.w || 0) <= 14;   // 구분선·포인트 라인은 강조색 유지
    if (e.stroke && e.strokeWidth > 0) e.stroke = p.accent;
    else if (e.fill && e.fill !== 'transparent') e.fill = thin ? p.accent : p.shapeFill;
    else e.stroke = p.accent;
  });
}
function applyPreset(key, all) {
  const p = PRESETS[key];
  if (!p) return;
  const targets = all ? state.project.slides : [curSlide()];
  targets.forEach(s => applyPresetToSlide(s, p));
  state.theme = key;
  pushHistory(); renderAll();
  toast('프리셋 적용 · ' + p.name + (all ? ' (전체 슬라이드)' : ''));
}

   ========================================================================= */
const mctx = document.createElement('canvas').getContext('2d');

  try { const c = document.createElement('canvas').getContext('2d'); c.letterSpacing = '2px'; return c.letterSpacing === '2px'; }
  catch (e) { return false; }
})();
function elFont(el) { return `${el.weight || 400} ${el.size}px ${fontStack(el.font)}`; }

function wrapText(el, maxW) {
  mctx.font = elFont(el);
  const ls = el.ls || 0;
  if (HAS_LS) mctx.letterSpacing = ls + 'px';
  const W = s => mctx.measureText(s).width;
  const out = [];
  const paras = String(el.text == null ? '' : el.text).split('\n');
  for (const p of paras) {
    if (p === '') { out.push(''); continue; }
    let line = '';
    for (const ch of p) {
      const test = line + ch;
      if (W(test) > maxW && line !== '') {
        const sp = line.lastIndexOf(' ');
        if (sp > 0 && line.length - sp <= 14) {
          out.push(line.slice(0, sp));
          line = line.slice(sp + 1) + ch;
        } else {
          out.push(line);
          line = ch === ' ' ? '' : ch;
        }
      } else {
        line = test;
      }
    }
    out.push(line.replace(/\s+$/, ''));
  }
  if (HAS_LS) mctx.letterSpacing = '0px';
  return out;
}

    }
    dt[i] = d;
  }
  for (let y = h - 1; y >= 0; y--) for (let x = w - 1; x >= 0; x--) {
    const i = y * w + x; if (dt[i] === 0) continue;
    let d = dt[i];
    if (x < w - 1) d = Math.min(d, dt[i + 1] + 1);
    if (y < h - 1) {
      d = Math.min(d, dt[i + w] + 1);
      if (x < w - 1) d = Math.min(d, dt[i + w + 1] + 1.414);
      if (x > 0) d = Math.min(d, dt[i + w - 1] + 1.414);
    }
    dt[i] = d;
  }
  return dt;
}

/* 큐빅이 붙을 좌표와 반지름을 뽑습니다
   — 큰 포인트 보석 → 기본 큐빅 → 빈틈을 메우는 미니 큐빅 순서로,
     반지름 + 틈(gap)으로 충돌을 확인해 겹치지 않게 앉힙니다.
     자리가 모자라면 한 단계씩 줄여 넣어, 빈틈마다 크기가 조금씩 다른
     큐빅이 자연스럽게 메워집니다 (핫픽스 전사지처럼). */
function stonePoints(el, mask) {
  const S = el.stones;
  const dia = clamp(Number(S.size) || 16, 4, 48);
  const dens = clamp(Number(S.density) || 88, 30, 100) / 100;
  const chaos = clamp(Number(S.chaos) || 0, 0, 100) / 100;
  const vary = clamp(S.vary == null ? 70 : Number(S.vary), 0, 100) / 100;
  const w = mask.w, h = mask.h, data = mask.data;
  const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : data[((y | 0) * w + (x | 0)) * 4 + 3];
  const rnd = mulberry32((Number(S.seed) || 1) >>> 0);
  const baseR = dia / 2;
  const gap = Math.max(.5, dia * (0.17 - 0.145 * dens));   // 밀도 100% ≈ 0.4px, 60% ≈ 1.3px
  const step = dia + gap;                                   // 기본 큐빅 중심 간격
  const maxR = baseR * (1 + .78 * vary) + .5;
  const pts = [];
  const cell = maxR * 2 + gap + 2;
  const cw = Math.ceil(w / cell) + 3, chh = Math.ceil(h / cell) + 3;
  const buckets = new Array(cw * chh);
  function accept(x, y, rad, commit) {
    const gx = ((x / cell) | 0) + 1, gy = ((y / cell) | 0) + 1;
    for (let ix = gx - 1; ix <= gx + 1; ix++) {
      const base = ix * chh;
      for (let iy = gy - 1; iy <= gy + 1; iy++) {
        const b = buckets[base + iy];
        if (!b) continue;
        for (let k = 0; k < b.length; k += 3) {
          const dx = b[k] - x, dy = b[k + 1] - y, rr = b[k + 2] + rad + gap;
          if (dx * dx + dy * dy < rr * rr) return false;
        }
      }
    }
    if (commit) {
      const idx = gx * chh + gy;
      (buckets[idx] || (buckets[idx] = [])).push(x, y, rad);
      pts.push([x, y, rad]);
    }
    return true;
  }
  // 자리가 모자라면 0.74배씩 줄여 빈틈에 앉힙니다
  function place(x, y, rad) {
    let r = rad;
    for (let k = 0; k < 4; k++) {
      if (r < baseR * .38) return false;
      if (accept(x, y, r, true)) return true;
      r *= .74;
    }
    return false;
  }
  const bigR = () => baseR * (1.36 + rnd() * .40);          // 1.36~1.76배 포인트 보석
  const normR = () => baseR * (.90 + rnd() * .16);

  const cand = [];
  if (S.style === 'line') {
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        if (A(x, y) < 128) continue;
        if (A(x - 1, y) >= 128 && A(x + 1, y) >= 128 && A(x, y - 1) >= 128 && A(x, y + 1) >= 128) continue;
        cand.push(y * w + x);
      }
    }
    for (let i = cand.length - 1; i > 0; i--) {
      const j = (rnd() * (i + 1)) | 0;
      const t = cand[i]; cand[i] = cand[j]; cand[j] = t;
    }
    for (let i = 0; i < cand.length; i++) {
      const x = cand[i] % w, y = (cand[i] / w) | 0;
      const jx = (rnd() - .5) * chaos * dia * .6, jy = (rnd() - .5) * chaos * dia * .6;
      const roll = rnd();
      place(x + jx, y + jy, roll < .16 * vary ? bigR() : normR());
    }
  } else {
    let bx0 = w, by0 = h, bx1 = 0, by1 = 0;
    const ins = [];
    for (let y = 0; y < h; y += 2) {
      for (let x = 0; x < w; x += 2) {
        if (data[(y * w + x) * 4 + 3] < 120) continue;
        ins.push(y * w + x);
        if (x < bx0) bx0 = x; if (x > bx1) bx1 = x;
        if (y < by0) by0 = y; if (y > by1) by1 = y;
      }
    }
    if (bx1 <= bx0 || by1 <= by0) return { pts, dia, spacing: step, baseR };
    const dt = inkDistance(mask);
    const deep = (x, y, rad) => {
      if (x < 0 || y < 0 || x >= w || y >= h) return false;
      return dt[(y | 0) * w + (x | 0)] >= Math.min(rad * .52, dia * .70);
    };
    // 1) 테두리 — 글자 윤곽을 따라 먼저 앉혀 실루엣을 또렷하게
    const edge = [];
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        if (A(x, y) < 128) continue;
        if (A(x - 1, y) >= 128 && A(x + 1, y) >= 128 && A(x, y - 1) >= 128 && A(x, y + 1) >= 128) continue;
        edge.push(y * w + x);
      }
    }
    for (let i = edge.length - 1; i > 0; i--) {
      const j = (rnd() * (i + 1)) | 0;
      const t = edge[i]; edge[i] = edge[j]; edge[j] = t;
    }
    const eR = baseR * .98;
    for (let i = 0; i < edge.length; i++) {
      const x0 = edge[i] % w, y0 = (edge[i] / w) | 0;
      const gx = dt[y0 * w + Math.min(w - 1, x0 + 1)] - dt[y0 * w + Math.max(0, x0 - 1)];
      const gy = dt[Math.min(h - 1, y0 + 1) * w + x0] - dt[Math.max(0, y0 - 1) * w + x0];
      const gl = Math.hypot(gx, gy) || 1;
      place(x0 + gx / gl * eR * .42, y0 + gy / gl * eR * .42, eR);
    }
    // 2) 큰 포인트 보석 — 드문드문, 자리가 모자라면 줄여서
    const bStep = step * 1.95;
    for (let y = bStep * .5; y < h; y += bStep) {
      const off = rnd() * bStep;
      for (let x = off - bStep; x < w + bStep; x += bStep) {
        if (rnd() >= .60 * vary) continue;
        const px = x + (rnd() - .5) * bStep * .7, py = y + (rnd() - .5) * bStep * .7;
        if (A(px, py) < 170) continue;
        const rad = bigR();
        if (deep(px, py, rad)) place(px, py, rad);
      }
    }
    // 3) 기본 큐빅 — 규칙적인 줄로 깔아 글자 모양이 또렷하게
    const g2 = step + .6;
    for (let y = g2 * .5; y < h; y += g2) {
      const off = rnd() * g2;
      for (let x = off - g2; x < w + g2; x += g2) {
        const px = x + (rnd() - .5) * g2 * .14, py = y + (rnd() - .5) * g2 * .14;
        if (A(px, py) < 170) continue;
        if (deep(px, py, baseR)) place(px, py, normR());
      }
    }
    // 4) 남은 빈틈 — 글자 속 아무 곳에나 던져, 안 맞으면 줄여서 메웁니다
    const tries = Math.min(14000, Math.round(ins.length * 2.6));
    for (let t = 0; t < tries && pts.length < 14000; t++) {
      const i = ins[(rnd() * ins.length) | 0];
      const x = (i % w) + (rnd() - .5) * 2, y = ((i / w) | 0) + (rnd() - .5) * 2;
      const q = rnd();
      const r0 = q < .16 * vary ? baseR * (1.05 + rnd() * .40) : baseR * (.58 + rnd() * .32);
      if (deep(x, y, r0)) place(x, y, r0);
    }
  }
  // 흩뿌림 — 완성된 배치를 조금씩 어긋나게 (0 = 단정, 100 = 손으로 대강)
  if (chaos > 0) {
    const amp = chaos * step * 0.26;
    for (let i = 0; i < pts.length; i++) {
      pts[i][0] += (rnd() - .5) * 2 * amp;
      pts[i][1] += (rnd() - .5) * 2 * amp;
    }
  }
  return { pts, dia, spacing: step, baseR };
}

/* --- 큐빅 한 알 --- */
function starPath(ctx, cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = (i % 2) ? r * .45 : r;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function heartPath(ctx, cx, cy, r) {
  const s = r * .98;
  ctx.beginPath();
  ctx.moveTo(cx, cy + s * .86);
  ctx.bezierCurveTo(cx - s * 1.16, cy + s * .04, cx - s * .68, cy - s * .92, cx, cy - s * .26);
  ctx.bezierCurveTo(cx + s * .68, cy - s * .92, cx + s * 1.16, cy + s * .04, cx, cy + s * .86);
  ctx.closePath();
}
/* 큐빅 한 알 — 다면체 컷(크라운 패싯 + 테이블 + 거들)으로 그립니다 */
function facetPath(ctx, cx, cy, R, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * Math.PI * 2 / n;
    const px = cx + Math.cos(a) * R, py = cy + Math.sin(a) * R;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function stoneTri(ctx, p1, p2, p3, fill) {
  ctx.beginPath();
  ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
/* 빛의 양(0~1)을 색으로 — 0.5보다 밝으면 반사면, 어두우면 굴절면 */
function facetTone(color, s) {
  s = clamp(s, 0, 1);
  const c = hexToRgb(color), luma = (c[0] * .299 + c[1] * .587 + c[2] * .114) / 255;
  const k = luma > .80 ? 1.42 : luma > .62 ? 1.34 : 1.28;   // 밝은 크리스탈일수록 그늘을 더 깊게
  return s >= .5
    ? lighten(color, (s - .5) * 1.62)      // 밝은 반사면
    : darken(color, (.5 - s) * k);         // 꺼진 굴절면
}
function stoneVerts(x, y, R, n, rot, rnd, jit) {
  const v = [], st = Math.PI * 2 / n;
  for (let i = 0; i < n; i++) {
    const a = rot + i * st, rr = R * (1 + (rnd() - .5) * jit);
    v.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
  }
  return v;
}
function stonePoly(ctx, v) {
  ctx.beginPath();
  for (let i = 0; i < v.length; i++) {
    if (i) ctx.lineTo(v[i][0], v[i][1]); else ctx.moveTo(v[i][0], v[i][1]);
  }
  ctx.closePath();
}
function drawCutStone(ctx, x, y, r, color, rnd) {
  const n = 8, st = Math.PI * 2 / n;
  const rot = rnd() * Math.PI * 2;
  const L = -2.30;                                  // 광원: 왼쪽 위

  if (r < 4.6) {
    // 아주 작은 큐빅 — 밝은 몸통 + 아래쪽 그늘 + 점광 (작은 크기에서 회색 안개가 되지 않게)
    const v = stoneVerts(x, y, r, 8, rot, rnd, .12);
    stonePoly(ctx, v);
    ctx.fillStyle = lighten(color, color === '#FFFFFF' ? 0 : .30); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y + r * .2);
    ctx.lineTo(x + r * .95, y + r * .25);
    ctx.lineTo(x + r * .55, y + r * .95);
    ctx.lineTo(x - r * .55, y + r * .95);
    ctx.lineTo(x - r * .95, y + r * .25);
    ctx.closePath();
    ctx.fillStyle = darken(color, .30); ctx.fill();
    ctx.beginPath(); ctx.arc(x - r * .22, y - r * .24, Math.max(.3, r * .30), 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    return;
  }
  if (r < 13) {
    // 작은 큐빅 — 어두운 테두리 + 방사형 패싯 + 밝은 중심 (작은 크기에서도 컷이 읽히게)
    const v = stoneVerts(x, y, r, 8, rot, rnd, .10);
    stonePoly(ctx, v);
    ctx.fillStyle = mixHex(color, '#0A0109', .50); ctx.fill();
    const v2 = stoneVerts(x, y, r * .84, 8, rot, rnd, .07);
    stonePoly(ctx, v2);
    ctx.fillStyle = darken(color, .18); ctx.fill();
    for (let i = 0; i < 8; i++) {
      const a0 = rot + i * Math.PI / 4, am = a0 + Math.PI / 8;
      const lit = Math.cos(am - L);
      const alt = (i % 2) ? -.16 : .16;
      stoneTri(ctx, [x, y], v2[i], v2[(i + 1) % 8], facetTone(color, .5 + .58 * lit + alt));
    }
    // 밝은 중심 — 작고 단단한 반사 코어 (부드러운 빛망울은 구슬처럼 보입니다)
    stonePoly(ctx, stoneVerts(x, y, r * .22, 6, rot + .3, rnd, .20));
    ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.fill();
    ctx.beginPath();
    ctx.arc(x - r * .34, y - r * .38, Math.max(.28, r * .10), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
    stonePoly(ctx, v);
    const gg = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
    gg.addColorStop(0, 'rgba(255,255,255,.78)');
    gg.addColorStop(.42, 'rgba(255,255,255,.18)');
    gg.addColorStop(.54, mixHex(color, '#0A0109', .55));
    gg.addColorStop(1, mixHex(color, '#050005', .88));
    ctx.lineWidth = Math.max(.36, r * .10); ctx.strokeStyle = gg; ctx.stroke();
    ctx.beginPath(); ctx.arc(x - r * .24, y - r * .28, Math.max(.3, r * .12), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
    return;
  }

  const outer = stoneVerts(x, y, r, n, rot, rnd, .13);
  const tbl = stoneVerts(x, y, r * .44, n, rot + Math.PI / n, rnd, .16);

  // 1) 패싯 틈으로 비치는 어두운 굴절면
  stonePoly(ctx, outer);
  ctx.fillStyle = mixHex(color, '#0A0109', .66); ctx.fill();

  // 2) 크라운 패싯 — 밝은 반사면과 어두운 굴절면이 번갈아 (핀휠 반짝임)
  for (let i = 0; i < n; i++) {
    const am = rot + i * st + st / 2;
    const lit = Math.cos(am - L);
    const lv = .5 + .5 * lit;
    const alt = (i % 2) ? -.17 : .17;
    const o0 = outer[i], o1 = outer[(i + 1) % n];
    const t0 = tbl[i], t1 = tbl[(i + 1) % n];
    stoneTri(ctx, t0, t1, o0, facetTone(color, lv * .98 + alt));
    stoneTri(ctx, t1, o1, o0, facetTone(color, lv * .60 + alt * .7));
    ctx.beginPath(); ctx.moveTo(o0[0], o0[1]); ctx.lineTo(t0[0], t0[1]);
    ctx.lineWidth = Math.max(.28, r * .05);
    ctx.strokeStyle = lit > .1 ? 'rgba(255,255,255,.30)' : 'rgba(10,1,8,.34)';
    ctx.stroke();
  }

  // 3) 테이블 — 판판한 팔각 면, 대각으로 갈라지는 반사
  stonePoly(ctx, tbl);
  const tg = ctx.createLinearGradient(x - r * .46, y - r * .46, x + r * .46, y + r * .46);
  tg.addColorStop(0, lighten(color, .88));
  tg.addColorStop(.50, lighten(color, .55));
  tg.addColorStop(.505, lighten(color, .16));
  tg.addColorStop(1, mixHex(color, '#150410', .38));
  ctx.fillStyle = tg; ctx.fill();
  for (let i = 0; i < n; i++) {
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tbl[i][0], tbl[i][1]);
    ctx.lineWidth = Math.max(.25, r * .035);
    ctx.strokeStyle = (i % 2) ? 'rgba(255,255,255,.40)' : 'rgba(16,3,14,.22)';
    ctx.stroke();
  }
  stonePoly(ctx, tbl);
  ctx.lineWidth = Math.max(.4, r * .055);
  ctx.strokeStyle = 'rgba(255,255,255,.62)'; ctx.stroke();

  // 4) 거들 — 컷의 윤곽. 왼쪽 위는 흰빛, 오른쪽 아래는 검게 꺼짐
  stonePoly(ctx, outer);
  const gg = ctx.createLinearGradient(x - r * .95, y - r * .95, x + r * .95, y + r * .95);
  gg.addColorStop(0, 'rgba(255,255,255,.95)');
  gg.addColorStop(.32, 'rgba(255,255,255,.36)');
  gg.addColorStop(.46, mixHex(color, '#0A0109', .55));
  gg.addColorStop(1, mixHex(color, '#050005', .85));
  ctx.lineWidth = Math.max(.45, r * .085);
  ctx.strokeStyle = gg; ctx.stroke();

  // 5) 정반사 — 면 위에 얹히는 날카로운 빛조각
  const hl = r * .13;
  ctx.save();
  ctx.translate(x - r * .31, y - r * .35);
  ctx.rotate(-.62);
  ctx.beginPath();
  ctx.moveTo(-hl * 1.25, 0); ctx.lineTo(0, -hl * .62); ctx.lineTo(hl * 1.05, 0); ctx.lineTo(0, hl * .62);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(x + r * .3, y + r * .28, Math.max(.35, r * .055), 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
}

/* 별 · 하트도 납작한 그라데이션 대신 날카로운 두 톤 면으로 */
function drawStarStone(ctx, x, y, r, color) {
  const s = r * 1.16;
  starPath(ctx, x, y, s);
  ctx.fillStyle = mixHex(color, '#0C0209', .48); ctx.fill();
  const g = ctx.createLinearGradient(x - s, y - s, x + s, y + s);
  g.addColorStop(0, lighten(color, .92));
  g.addColorStop(.46, lighten(color, .30));
  g.addColorStop(.54, darken(color, .46));
  g.addColorStop(1, mixHex(color, '#080107', .76));
  starPath(ctx, x, y, s * .96);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = Math.max(.4, r * .10); ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(x - r * .10, y - r * .18, Math.max(.4, r * .16), 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
}
function drawHeartStone(ctx, x, y, r, color) {
  const s = r * 1.02;
  heartPath(ctx, x, y, s);
  ctx.fillStyle = mixHex(color, '#0C0209', .46); ctx.fill();
  const g = ctx.createLinearGradient(x - s, y - s, x + s, y + s);
  g.addColorStop(0, lighten(color, .90));
  g.addColorStop(.44, lighten(color, .26));
  g.addColorStop(.56, darken(color, .44));
  g.addColorStop(1, mixHex(color, '#080107', .74));
  heartPath(ctx, x, y, s * .94);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = Math.max(.4, r * .09); ctx.strokeStyle = 'rgba(255,255,255,.42)'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x - r * .30, y - r * .30, r * .22, r * .13, -.6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill();
}

/* 반짝임 — 4각 별빛(✦) 글린트를 큰 보석 위에 얹습니다 */
function drawGlint(ctx, x, y, R, rot) {
  if (R < 1) return;
  const halo = ctx.createRadialGradient(x, y, 0, x, y, R * 1.9);
  halo.addColorStop(0, 'rgba(255,255,255,.30)');
  halo.addColorStop(.22, 'rgba(255,252,242,.16)');
  halo.addColorStop(.6, 'rgba(255,248,228,.05)');
  halo.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(x, y, R * 1.9, 0, Math.PI * 2);
  ctx.fillStyle = halo; ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(R / 12, R / 12);

   ========================================================================= */
function exportShape() {
  return { app: 'cardnews-studio', version: 1, title: state.project.title, format: state.project.format, slides: state.project.slides };
}

function normalizeProject(raw, fallbackFormat) {
  let data = raw;
  if (typeof data === 'string') data = JSON.parse(data);
  if (Array.isArray(data)) data = { slides: data };
  if (!data || typeof data !== 'object') throw new Error('JSON 형식이 올바르지 않습니다.');
  if (data.project && typeof data.project === 'object') data = data.project;
  if (data.data && typeof data.data === 'object' && !data.slides) data = data.data;
  const arr = data.slides || data.cards || data.pages || data.items || data.list;
  if (!Array.isArray(arr) || !arr.length) throw new Error('slides 배열을 찾지 못했습니다.');
  let formatKey = FORMATS[data.format] ? data.format : null;
  if (!formatKey && data.width && data.height) {
    const ratio = data.width / data.height;
    if (Math.abs(ratio - 1) < .03) formatKey = '1:1';
    else if (Math.abs(ratio - 1080 / 1350) < .03) formatKey = '4:5';
    else if (Math.abs(ratio - 1080 / 1920) < .03) formatKey = '9:16';
  }
  if (!formatKey) formatKey = fallbackFormat || state.project.format;
  const f = FORMATS[formatKey];
  const slides = arr.map(s => normalizeSlide(s, f)).filter(Boolean);
  if (!slides.length) throw new Error('변환 가능한 슬라이드가 없습니다.');
  return { app: 'cardnews-studio', version: 1, title: data.title || data.name || state.project.title, format: formatKey, slides };
}

function pctNum(v, base, dflt) {
  if (typeof v === 'string' && v.trim().endsWith('%')) return Math.round(base * parseFloat(v) / 100);
  if (typeof v === 'number' && isFinite(v)) return Math.round(v);
  return dflt;
}

function normalizeElement(raw, f) {
  if (!raw || typeof raw !== 'object') return null;
  let type = raw.type || raw.kind || raw.elType;
  if (!type) {
    if (raw.src || raw.image || raw.imageUrl || raw.url) type = 'image';
    else if (raw.shape) type = 'shape';
    else type = 'text';
  }
  type = String(type).toLowerCase();
  if (type === 'img' || type === 'photo' || type === 'picture') type = 'image';
  if (type === 'rect' || type === 'line' || type === 'ellipse' || type === 'circle') { raw.shape = raw.shape || (type === 'circle' ? 'ellipse' : type); type = 'shape'; }

  const x = pctNum(raw.x != null ? raw.x : raw.left, f.w, 0);
  const y = pctNum(raw.y != null ? raw.y : raw.top, f.h, 0);
  const w = pctNum(raw.w != null ? raw.w : raw.width, f.w, type === 'text' ? Math.round(f.w * .8) : Math.round(f.w * .5));
  const h = pctNum(raw.h != null ? raw.h : raw.height, f.h, type === 'text' ? 100 : Math.round(f.h * .35));

  if (type === 'image') {
    const src = raw.src || raw.image || raw.imageUrl || raw.url || raw.data || '';
    if (!src) return null;
    return imageEl({
      x, y, w, h, src,
      fit: (raw.fit === 'contain' || raw.objectFit === 'contain') ? 'contain' : 'cover',
      radius: raw.radius || raw.borderRadius || 0,
      shadow: !!raw.shadow,
      opacity: raw.opacity == null ? 1 : raw.opacity,
      lock: raw.lock !== false,
      zoom: Number(raw.zoom) || 1,
      ox: Number(raw.ox) || 0,
      oy: Number(raw.oy) || 0
    });
  }
  if (type === 'shape') {
    const sh = raw.shape || raw.shapeType || 'rect';
    return shapeEl({
      x, y, w, h,
      shape: sh === 'circle' ? 'ellipse' : sh,
      fill: raw.fill || raw.color || raw.backgroundColor || '#1F7A55',
      stroke: raw.stroke || raw.borderColor || '',
      strokeWidth: raw.strokeWidth || raw.borderWidth || 0,
      radius: raw.radius || raw.borderRadius || 0,
      shadow: !!raw.shadow,
      opacity: raw.opacity == null ? 1 : raw.opacity
    });
  }
  const size = raw.size || raw.fontSize || (raw.style && raw.style.fontSize) || 40;
  return textEl({
    x, y, w,
    text: String(raw.text != null ? raw.text : (raw.content != null ? raw.content : (raw.value != null ? raw.value : ''))),
    font: raw.font || raw.fontFamily || raw.style && raw.style.fontFamily || 'Pretendard',
    size: Math.round(parseFloat(size) || 40),
    weight: parseInt(raw.weight || raw.fontWeight || (raw.style && raw.style.fontWeight) || 400, 10) || 400,
    color: raw.color || raw.textColor || '#14171C',
    ls: raw.ls != null ? raw.ls : (raw.letterSpacing || 0),
    lh: raw.lh != null ? raw.lh : (raw.lineHeight || 1.42),
    align: raw.align || raw.textAlign || 'left',
    boxColor: raw.boxColor || raw.background || 'transparent',
    pad: raw.pad || raw.padding || 0,
    boxRadius: raw.boxRadius || raw.borderRadius || 0,
    opacity: raw.opacity == null ? 1 : raw.opacity,
    stones: (raw.stones && raw.stones.on) ? Object.assign(stoneDefaults(), raw.stones) : null
  });
}

/* 제목/본문/이미지 필드만 있는 간단한 데이터도 예쁘게 배치 */
function composeSimpleSlide(s, f) {
  const M = Math.round(f.w * .082);
  const els = [];
  let y = Math.round(f.h * .13);
  const kicker = s.kicker || s.label || s.eyebrow || s.category;
  const title = s.title || s.headline || s.subject || '';
  const sub = s.subtitle || s.sub || s.description || '';
  const body = s.body || s.content || s.text || s.caption || '';
  const img = s.image || s.img || s.photo || s.imageUrl;

  if (kicker) {
    els.push(textEl({ x: M, y, w: f.w - M * 2, text: String(kicker), size: Math.round(f.w * .023), weight: 700, ls: 4, color: '#3E6B4F' }));
    y += Math.round(f.w * .06);
  }
  if (title) {
    const size = title.length > 26 ? 76 : 92;
    els.push(textEl({ x: M, y, w: f.w - M * 2, text: String(title), font: 'Noto Serif KR', size, weight: 700, lh: 1.28, ls: -1.5, color: '#17251C' }));
    y += Math.round(size * 1.3 * String(title).split('\n').length) + Math.round(f.w * .03);
  }
  if (sub) {
    els.push(textEl({ x: M, y, w: f.w - M * 2, text: String(sub), size: 38, lh: 1.6, color: '#3E6B4F' }));
    y += Math.round(38 * 1.6 * String(sub).split('\n').length) + Math.round(f.w * .025);
  }
  if (body) {
    els.push(textEl({ x: M, y, w: f.w - M * 2, text: String(body), size: 32, lh: 1.75, color: '#4E5A51' }));
    y += Math.round(32 * 1.75 * String(body).split('\n').length) + Math.round(f.w * .03);
  }
  if (img) {
    const ih = Math.max(120, Math.min(Math.round(f.h * .3), f.h - y - M));
    els.push(imageEl({ x: M, y: Math.min(y, f.h - ih - M), w: f.w - M * 2, h: ih, src: String(img), fit: 'cover', radius: 18 }));
  }
  return { id: uid('sl'), bg: { type: 'solid', color: '#F5F1E6', c1: '#F5F1E6', c2: '#E7EADB', angle: 160, src: '', overlay: 0 }, els };
}

function normalizeSlide(s, f) {
  if (!s || typeof s !== 'object') return null;
  const rawEls = s.els || s.elements || s.layers || s.objects || s.items;
  let els = [];
  if (Array.isArray(rawEls)) {
    els = rawEls.map(e => normalizeElement(e, f)).filter(Boolean);
  } else if (Array.isArray(s.texts) || Array.isArray(s.images)) {
    (s.texts || []).forEach(t => { const e = normalizeElement(Object.assign({ type: 'text' }, t), f); if (e) els.push(e); });
    (s.images || []).forEach(t => { const e = normalizeElement(Object.assign({ type: 'image' }, t), f); if (e) els.push(e); });
  }
  if (!els.length) {
    const simple = composeSimpleSlide(s, f);
    if (!simple.els.length) {
      // 완전히 빈 슬라이드도 허용
      els = [];
    } else els = simple.els;
  }
  let bg = { type: 'solid', color: '#F5F1E6', c1: '#F5F1E6', c2: '#E7EADB', angle: 160, src: '', overlay: 0 };
  if (s.bg && typeof s.bg === 'object') bg = Object.assign(bg, s.bg);
  else if (typeof s.background === 'string') {
    if (/^#|rgb|hsl/.test(s.background)) bg = { type: 'solid', color: s.background, c1: '#F5F1E6', c2: '#E7EADB', angle: 160, src: '', overlay: 0 };
    else if (/^data:image|^https?:/.test(s.background)) bg = { type: 'image', src: s.background, color: '#111', overlay: s.overlay || 0, c1: '#F5F1E6', c2: '#E7EADB', angle: 160 };
  }
  return { id: uid('sl'), bg, els };
}

function openModal(title, bodyHTML, actions) {
  dom.modal.innerHTML = `<div class="modal-h"><h2>${esc(title)}</h2><button class="x" data-close>×</button></div>
    <div class="modal-b">${bodyHTML}</div>
    <div class="modal-f">${(actions || []).map((a, i) => `<button class="btn ${a.cls || ''}" data-mi="${i}">${esc(a.label)}</button>`).join('')}</div>`;
  dom.modalRoot.classList.add('on');
  dom.modal.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  (actions || []).forEach((a, i) => {
    const btn = dom.modal.querySelector(`[data-mi="${i}"]`);
    if (btn) btn.addEventListener('click', () => { if (a.close) closeModal(); if (a.onClick) a.onClick(); });
  });
}
function closeModal() { dom.modalRoot.classList.remove('on'); }

    }));

async function copyText(t) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(t);
      return true;
    }
  } catch (e) { /* 권한 없음 → 아래 폴백 */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e2) { return false; }
}
async function aiCopyPrompt() {
  const ok = await copyText(aiPromptText());
  if (ok) {
    aiStatusSet('프롬프트를 복사했습니다. 외부 도구에 붙여 넣어 이미지를 만든 뒤 2번으로 올리세요.', 'ok');
    toast('프롬프트를 복사했습니다.');

}
