<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<script>
  /* Apply the saved unlock state before first paint, so an unlocked tab
     never flashes the lock screen. */
  (function () {
    try {
      if (window.sessionStorage.getItem('rp.lock.v1') === 'unlocked') {
        document.documentElement.className += ' rp-unlocked';
      }
    } catch (e) { /* storage blocked: stay locked until the password is entered */ }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#FAF8F5" />
<meta name="color-scheme" content="light" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="한자와이" />
<meta name="description" content="한자의 '이유'를 보고 저절로 기억되는 한국 한자 학습 앱 · 급수별 훈음·부수·한자어 (프로토타입)" />
<title>한자와이 HanjaWhy · 한 화면 프로토타입</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#FAF8F5;
  --bg2:#F4EFE7;
  --paper:#FFFFFF;
  --ink:#22303E;
  --ink2:#4C5B6B;
  --ink3:#8B96A2;
  --navy:#2C4A6E;
  --navy2:#3E6089;
  --navysoft:#E9EEF4;
  --line:#E6E0D5;
  --line2:#F1ECE3;
  --gold:#BF8A3D;
  --ok:#2F6B4F;
  --danger:#9C4A46;
  --sh:0 1px 2px rgba(34,48,62,.04), 0 10px 26px -24px rgba(34,48,62,.55);
  --r:16px;
  --serif:"Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo","AppleMyungjo","Batang","Unifont JP",serif;
  --kr:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{
  font-family:var(--kr);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;align-items:center;justify-content:center;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:center;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy2);outline-offset:2px;border-radius:6px}
::selection{background:#DCE6F1}

/* ---------- app shell ---------- */
.stage{width:100%;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}
.app{
  position:relative;isolation:isolate;
  width:100%;height:100vh;height:100dvh;max-height:100dvh;
  display:flex;flex-direction:column;justify-content:space-between;
  background:var(--bg);overflow:hidden;
}
@media (min-width:520px){
  body{background:radial-gradient(120% 100% at 50% 0%,#FFFDF9 0%,#F5F0E7 60%,#F1EBE1 100%)}
  .app{
    width:440px;max-width:440px;height:min(880px,96dvh);max-height:96dvh;
    border:1px solid #E4DDD1;border-radius:38px;
    box-shadow:0 50px 90px -60px rgba(26,38,52,.65), 0 2px 0 rgba(255,255,255,.9) inset, 0 0 0 6px rgba(255,255,255,.35);
    background:radial-gradient(130% 70% at 50% 0%,#FFFDFA 0%,var(--bg) 55%);
  }
}

/* ---------- top bar ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 2px;
}
.pbar{flex:1 1 auto;height:5px;border-radius:99px;background:#E8E2D8;overflow:hidden;min-width:40px}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#3E6089,#2C4A6E);transition:width .45s cubic-bezier(.2,.7,.2,1)}
.today{flex:0 0 auto;font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.lvl{
  flex:0 0 auto;height:26px;min-width:38px;padding:0 8px;border-radius:8px;
  background:var(--navy);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.02em;
  display:grid;place-items:center;box-shadow:0 4px 10px -6px rgba(44,74,110,.9);white-space:nowrap;
}
.icon{
  flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;
  color:var(--ink2);font-size:12.5px;line-height:1;display:grid;place-items:center;
}
.icon:active{background:#F5F1E9}

/* ---------- hero ---------- */
.hero{flex:0 0 auto;height:clamp(272px,44vh,430px);min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 14px 0}
.card{
  position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
}
.card.l{padding:9px 8px 8px;align-items:center}
.hanja{
  flex:0 0 auto;max-width:100%;padding:0 15px;text-align:center;
  font-size:clamp(13px,3.55vw,18px);font-weight:800;color:var(--navy);letter-spacing:-.03em;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.glyph{
  flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:var(--serif);font-weight:500;color:var(--navy);
  font-size:clamp(54px,17.5vh,150px);line-height:1;letter-spacing:-.02em;
}
.strokes{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;
  font-size:clamp(10px,2.75vw,12px);font-weight:700;color:var(--ink2);letter-spacing:-.01em;
}
.pen{width:21px;height:21px;border-radius:50%;background:#F2EEE5;display:grid;place-items:center;font-size:10px;line-height:1}
.star{
  position:absolute;top:1px;right:1px;width:30px;height:30px;display:grid;place-items:center;
  font-size:15px;line-height:1;color:#C3CAD3;z-index:2;
}
.star.on{color:var(--gold)}
.star:active{transform:scale(.92)}

.card.r{padding:10px 10px 9px;gap:2px;cursor:pointer;justify-content:space-between}
.card.l,.card.r{container-type:size}
@supports not (container-type:size){.card.l,.card.r{container-type:normal}}
.why{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:14px}
.why>span{font-size:clamp(9.5px,2.45vw,11.5px);font-weight:800;color:var(--navy);letter-spacing:.01em}
.more{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:9.5px;font-weight:800;color:var(--ink3);padding-left:6px;letter-spacing:-.01em}
.core{
  flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px;
}
.fx{
  flex:0 0 auto;width:100%;display:grid;grid-template-columns:1fr 1fr;
  align-content:center;padding:2px;gap:4px 0;
}
.fx.c3{grid-template-columns:1fr 1fr 1fr}
.comp{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:1px 0}
.comp b{
  font-family:var(--serif);font-weight:600;color:var(--navy);line-height:1.05;
  font-size:clamp(17px,4.7vw,31px);
}
.comp i{
  font-style:normal;font-weight:700;color:var(--ink3);margin-top:1px;
  font-size:clamp(7.5px,1.95vw,9.5px);letter-spacing:-.02em;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.comp.plus::after{
  content:"+";position:absolute;right:-3px;top:50%;transform:translateY(-50%);
  font-size:11px;font-weight:800;color:#C6CDD6;
}
.fx.pict{grid-template-columns:1fr}
.fx.pict .comp b{font-size:clamp(30px,9vw,54px);line-height:1.1}
.res{
  flex:0 0 auto;width:100%;text-align:center;padding:0 2px 2px;
  font-size:clamp(9.5px,2.5vw,11.5px);font-weight:700;color:var(--ink2);line-height:1.45;
  letter-spacing:-.03em;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.res .eq{font-weight:800;color:#B6C0CA;margin-right:3px}
.hint{
  flex:0 0 auto;width:100%;display:flex;align-items:center;gap:5px;
  border-top:1px solid var(--line2);padding-top:6px;
}
.hint .hb{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.hint small{font-size:8px;font-weight:800;color:#ABA394;letter-spacing:.03em;line-height:1.2;margin-bottom:1px}
.hint .ck{
  flex:0 0 13px;width:13px;height:13px;border-radius:50%;background:var(--navy);color:#fff;
  font-size:7.5px;line-height:1;display:grid;place-items:center;margin-top:1px;
}
.hint b{
  font-size:clamp(12px,3.2vw,15.5px);font-weight:800;color:var(--navy);letter-spacing:-.03em;
  line-height:1.25;word-break:keep-all;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
}

/* masked (active recall) */
.masked{position:relative;cursor:pointer}
.masked>*{visibility:hidden}
.masked::after{
  content:"?";position:absolute;inset:0;display:grid;place-items:center;visibility:visible;
  color:#C3BAA9;font-weight:800;font-size:11px;font-family:var(--kr);letter-spacing:.06em;
  background:#F6F2EA;border-radius:9px;z-index:1;
}
.hint.masked::after,.res.masked::after{border-radius:7px}
.fx.masked::after{content:"? ?";font-size:15px;letter-spacing:.22em;background:#F8F5EF}
.fx.pict.masked::after{content:"?"}

/* ---------- strip ---------- */
.strip{flex:0 0 auto;padding:9px 0 0}
.strip-h{
  display:flex;align-items:center;gap:4px;padding:0 14px 5px;
  font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:-.01em;
}
.strip-more{margin-left:auto;font-weight:700;color:#B6AEA0;font-size:9.5px;letter-spacing:-.01em}
.strip-h .info{
  width:13px;height:13px;border-radius:50%;border:1px solid #DED7CA;color:#AAA294;
  font-size:8px;font-weight:800;display:grid;place-items:center;line-height:1;
}
.chips{
  display:flex;align-items:center;gap:6px;padding:0 14px 2px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  position:relative;flex:0 0 auto;min-width:62px;height:62px;padding:0 9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);
}
.chip b{font-family:var(--serif);font-weight:600;color:var(--navy);font-size:22px;line-height:1}
.chip i{font-style:normal;font-size:8.5px;font-weight:700;color:var(--ink3);letter-spacing:-.02em;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .lk{position:absolute;top:2px;right:3px;font-size:6.5px;font-weight:800;color:#A79E8C;letter-spacing:.02em}
.chip.locked{background:#F6F2EB;border-color:#DED6C8;border-style:dashed}
.chip.locked b{color:#B5AB9A}
.chip.locked i{color:#B0A79A}
.chip.static{background:#FBF8F3;box-shadow:none;border-color:#EDE6DA}
.chip.static b{color:#7C8A99}
.chip.on{border-color:#C6D4E3;background:#F3F7FB}
.chip:active{transform:scale(.97)}
.sep{flex:0 0 auto;width:1px;height:26px;background:var(--line);margin:0 1px}

/* ---------- readings ---------- */
.read{
  flex:0 0 auto;margin:10px 14px 0;background:#fff;border:1px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:var(--sh);
}
.rrow{display:flex;align-items:center;gap:8px;min-height:46px;padding:5px 9px 5px 6px;width:100%;text-align:left}
.rrow+.rrow{border-top:1px solid var(--line2)}
.rlab{
  flex:0 0 42px;width:42px;align-self:stretch;border-radius:9px;
  background:linear-gradient(180deg,#345780,#2A4769);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
}
.rlab b{font-size:12.5px;font-weight:800;letter-spacing:.02em}
.rlab small{font-size:7.5px;font-weight:700;opacity:.78;margin-top:1px;letter-spacing:.02em}
.rval{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:6px;overflow:hidden}
.rval .big{
  font-size:clamp(14px,3.9vw,18px);font-weight:800;color:var(--ink);letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rval .sub{font-size:9.5px;font-weight:700;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rval.masked{flex:0 0 auto;min-width:64px;max-width:120px}
.rval.masked::after{content:"?";font-size:12px}
.spk{
  flex:0 0 25px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:var(--navysoft);color:var(--navy);
}
.spk:active{background:#DDE6EF}
.spk svg{width:12px;height:12px;display:block}
.words{flex:1 1 auto;min-width:0;font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.words .em{color:var(--ink3);font-weight:600}
.wc{
  flex:0 0 auto;font-size:9px;font-weight:800;color:var(--navy);background:#F4F1EA;
  border-radius:7px;padding:4.5px 6px;white-space:nowrap;letter-spacing:-.01em;
}
.wc:active{background:#EAE4D8}

/* ---------- dock ---------- */
.dock{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;margin-top:10px;
  padding:10px 14px calc(11px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--bg);
}
.btn{
  height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:4px;
  font-weight:800;letter-spacing:-.02em;transition:transform .12s ease,background .2s;
}
.btn:active{transform:scale(.975)}
.btn .bi{font-size:13px;line-height:1;font-weight:400}
.btn.ghost{
  flex:0 0 27%;min-width:0;border:1px solid var(--line);background:#fff;color:var(--navy);
  font-size:11px;box-shadow:var(--sh);
}
.btn.ghost.on{border-color:#C6D4E3;background:var(--navysoft)}
.btn.primary{
  flex:1 1 auto;min-width:0;color:#fff;font-size:13.5px;
  background:linear-gradient(180deg,#3C608B,#2A4769);
  box-shadow:0 12px 24px -16px rgba(44,74,110,.95),0 1px 0 rgba(255,255,255,.16) inset;
}

/* ---------- scrim / sheet / pop / toast ---------- */
.scrim{
  position:absolute;inset:0;z-index:40;background:rgba(28,38,50,.36);
  opacity:0;pointer-events:none;transition:opacity .25s ease;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.scrim.on{opacity:1;pointer-events:auto}
.app.sheet-on .topbar,.app.sheet-on .hero,.app.sheet-on .strip,.app.sheet-on .read,.app.sheet-on .dock{filter:blur(9px) saturate(.85);transition:filter .25s ease}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:50;display:flex;
  max-height:88%;transform:translateY(104%);pointer-events:none;
  transition:transform .32s cubic-bezier(.22,.75,.2,1);
}
.sheet.on{transform:translateY(0);pointer-events:auto}
.sheet.tall{height:84%;max-height:84%}
.sheet.tall .sheet-in{height:100%;max-height:100%}
.sheet.tall #sheetBody{min-height:100%;display:flex;flex-direction:column}
.sheet-in{
  width:100%;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#FCFAF6;border-radius:22px 22px 0 0;
  box-shadow:0 -24px 60px -30px rgba(20,30,40,.55);
  padding:5px 16px calc(16px + env(safe-area-inset-bottom));
}
.grab{width:38px;height:4px;border-radius:99px;background:#DED7CA;margin:3px auto 10px}

.pop{
  position:absolute;top:calc(42px + env(safe-area-inset-top));right:12px;width:200px;z-index:45;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;
  box-shadow:0 24px 50px -24px rgba(34,48,62,.55);
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:.18s ease;
}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.prow{
  width:100%;display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:9px;
  font-size:11px;font-weight:700;color:var(--ink2);text-align:left;
}
.prow:hover{background:#F7F4EE}
.prow .pl{
  flex:0 0 30px;width:30px;height:20px;border-radius:6px;background:var(--navysoft);color:var(--navy);
  font-size:10px;font-weight:800;display:grid;place-items:center;letter-spacing:.02em;
}
.prow .pt{flex:1 1 auto;font-variant-numeric:tabular-nums;color:var(--ink3);font-weight:700;font-size:10px}
.prow .pn{font-size:9.5px;font-weight:800;color:var(--navy);white-space:nowrap}
.prow.lk .pl{background:#F2EDE4;color:#B5AB98}
.prow.lk .pn{color:#B5AB98}
.pop-foot{padding:6px 8px 3px;border-top:1px solid var(--line2);margin-top:4px;font-size:8.5px;line-height:1.5;color:#A9A193;font-weight:600}

.toast{
  position:absolute;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));z-index:60;
  transform:translate(-50%,10px);max-width:84%;
  background:rgba(30,43,56,.95);color:#fff;font-size:11.5px;font-weight:700;line-height:1.45;
  padding:9px 13px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;letter-spacing:-.01em;
  box-shadow:0 16px 30px -18px rgba(20,30,40,.8);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- sheet content ---------- */
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 10px}
.sh-h h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.sh-h .x{
  width:28px;height:28px;border-radius:50%;background:#F1ECE2;color:var(--ink2);
  font-size:12px;display:grid;place-items:center;flex:0 0 28px;
}
.sh-sub{margin:-6px 2px 12px;font-size:11.5px;line-height:1.55;color:var(--ink3);font-weight:600}

/* paywall */
.pw-hero{
  position:relative;overflow:hidden;border-radius:18px;padding:16px 15px 15px;color:#fff;
  background:linear-gradient(155deg,#3A5F8C 0%,#284669 60%,#223C5A 100%);
  box-shadow:0 18px 34px -22px rgba(34,60,90,.9);
}
.pw-hero::after{
  content:"";position:absolute;right:-40px;top:-60px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);
}
.pw-ico{font-size:18px;line-height:1;margin-bottom:7px;filter:saturate(.2) brightness(1.6)}
.pw-x{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:11px;flex:0 0 26px;display:grid;place-items:center;z-index:2}
.pw-hero h2{margin:0 0 6px;font-size:16.5px;font-weight:800;letter-spacing:-.035em;line-height:1.3}
.pw-hero p{margin:0;font-size:11.5px;line-height:1.6;color:#D9E3EE;font-weight:600;letter-spacing:-.01em}
.pw-free{
  display:flex;align-items:center;gap:6px;margin:10px 0 0;padding:9px 11px;border-radius:12px;
  background:#F1F4F8;border:1px solid #E2E8EF;font-size:10.5px;font-weight:700;
  color:var(--ink2);line-height:1.45;
}
.pw-free b{color:var(--navy)}
.pw-list{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pw-list li{display:flex;gap:8px;align-items:flex-start;font-size:12px;font-weight:700;color:var(--ink);line-height:1.45}
.pw-list li i{
  flex:0 0 16px;width:16px;height:16px;border-radius:50%;background:var(--navy);color:#fff;
  font-style:normal;font-size:8px;display:grid;place-items:center;margin-top:1px;
}
.pw-list li span small{display:block;font-size:10px;font-weight:600;color:var(--ink3);margin-top:1px}
.pw-price{
  margin:14px 0 0;padding:12px 13px;border-radius:14px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
}
.pw-price b{font-size:21px;font-weight:800;letter-spacing:-.04em;color:var(--navy)}
.pw-price span{font-size:9.5px;font-weight:700;color:var(--ink3);text-align:right;line-height:1.35}
.pw-cta{

 story:"뜻을 담은 木에 소리 公을 붙여 만든 글자예요. 겨울에도 푸른 나무, 소나무를 가리켜요.",

{id:"h36",h:"泉",lv:"4급",hoon:"샘",eum:"천",st:9,fam:"水",cat:"자연",
 comps:[["白","맑을 백"],["水","물"]],res:"맑고 밝은(白) 물(水)이 솟는 샘",core:"샘",
 story:"땅 밑에서 맑고 밝게(白) 솟아나는 물(水)이 샘이에요. 온천(溫泉)은 따뜻한 물이 솟는 샘이에요.",

{id:"h37",h:"烈",lv:"4급",hoon:"매울",eum:"렬",st:10,fam:"火",cat:"마음",
 comps:[["列","벌일 렬"],["灬","불"]],res:"불(灬)이 세차게 벌여지다(列) → 맵다",core:"맵다, 세차다",
 story:"불(灬)이 세차게 벌여진(列) 모습이에요. 그래서 '맵다, 세차다'는 뜻이 되었고, 열렬(熱烈)은 마음이 세차게 타오르는 것이에요.",
 words:[["熱烈","열렬","마음이 세차게 타오름"],["强烈","강렬","세고 맵게"],["猛烈","맹렬","몹시 사나움"]]},

 comps:[["扌","손"],["斤","도끼 근"]],res:"손(扌)에 도끼(斤)를 들고 나무를 꺾다",core:"꺾다",
 story:"손(扌)에 도끼(斤)를 들고 나무를 자르듯 꺾는 모습이에요. 절반(折半)은 둘로 꺾어 나눈 것, 좌절(挫折)은 의지가 꺾인 것이에요.",
 words:[["折半","절반","둘로 나눈 반"],["折衝","절충","서로 양보해 맞춤"],["挫折","좌절","의지가 꺾임"],["屈折","굴절","휘어 꺾임"]]},

{id:"h39",h:"枯",lv:"3급",hoon:"마를",eum:"고",st:9,fam:"木",cat:"자연",
 comps:[["木","나무"],["古","옛 고"]],res:"오래된(古) 나무(木)는 마르기 마련",core:"마르다",
 story:"오래된(古) 나무(木)는 물이 말라 마르기 마련이에요. 그래서 '마르다'가 되었고, 고목(枯木)은 마른 나무예요.",
 words:[["枯木","고목","마른 나무"],["枯渴","고갈","말라 바닥남"],["枯死","고사","말라 죽음"]]}
];

var FAMS = {
 "木":{h:"나무 목",st:4,desc:"나무의 줄기와 가지, 뿌리를 그린 그림에서 시작했어요. 나무·목재·나무로 만든 것에 두루 쓰여요."},
 "水":{h:"물 수",st:4,desc:"흐르는 물줄기를 그린 그림이에요. 왼쪽에 氵로 오면 물·액체·씻기와 이어져요."},
 "火":{h:"불 화",st:4,desc:"타오르는 불꽃을 그린 그림이에요. 아래에 灬로 오면 불·열·굽기를 나타내요."},
 "心":{h:"마음 심",st:4,desc:"심장을 그린 그림이에요. 왼쪽에 忄로 오면 마음·감정·생각과 이어져요."},
 "人":{h:"사람 인",st:2,desc:"옆으로 선 사람을 그린 그림이에요. 왼쪽에 亻로 오면 사람의 행동과 관계를 나타내요."},
 "言":{h:"말씀 언",st:7,desc:"입에서 나오는 말을 표시한 글자예요. 말·글·기록과 이어져요."},
 "日":{h:"날 일",st:4,desc:"해를 그린 그림이에요. 해·날·때·밝기를 나타내요."},
 "手":{h:"손 수",st:4,desc:"손가락 다섯을 편 손을 그린 그림이에요. 왼쪽에 扌로 오면 손으로 하는 동작을 나타내요."}
};
</script>
<script>
(function(){
'use strict';

/* =========================================================
   기본 설정
   ========================================================= */
var LEVELS = ['8급','7급','6급','5급','4급','3급'];
var FREE_LEVELS = ['8급','7급','6급'];
var LV_TOTAL = {'8급':50,'7급':150,'6급':300,'5급':500,'4급':1000,'3급':1817};
var FREE_TOTAL = 500;
var PAID_TOTAL = 3500;
var FAM_VAR = {'氵':'水','忄':'心','亻':'人','扌':'手','灬':'火'};
var LS = 'hanjaWhy.v1';
var GOALS = [5,8,12];

/* =========================================================
   데이터 준비
   ========================================================= */
var COUNT = {}; LEVELS.forEach(function(l){ COUNT[l] = 0; });
var DATA = [], byId = {}, byHanja = {}, families = {}, familyList = [];

HANJA.forEach(function(raw,i){
  var c = {
    id: raw.id, h: raw.h, lv: raw.lv, hoon: raw.hoon, eum: raw.eum,
    st: raw.st, fam: raw.fam, cat: raw.cat,
    comps: (raw.comps || []).slice(), res: raw.res, core: raw.core,
    pict: raw.pict || '', story: raw.story, words: (raw.words || []).slice(),
    _i: i
  };
  c.hoonum = c.hoon + ' ' + c.eum;
  c.rad = c.fam;
  for(var k=0;k<c.comps.length;k++){
    var ch = c.comps[k][0];
    if((FAM_VAR[ch] || ch) === c.fam){ c.rad = ch; break; }
  }
  DATA.push(c);
  byId[c.id] = c;
  byHanja[c.h] = c;
  if(COUNT[c.lv] !== undefined) COUNT[c.lv]++;
});

DATA = DATA.slice().sort(function(a,b){
  return (LEVELS.indexOf(a.lv) - LEVELS.indexOf(b.lv)) || (a._i - b._i);
});

DATA.forEach(function(c){
  var f = families[c.fam];
  if(!f) f = families[c.fam] = { name:c.fam, members:[], total:0, hoon:'', desc:'' };
  f.members.push(c);
});
familyList = Object.keys(families).map(function(k){ return families[k]; });
familyList.forEach(function(f){
  var info = FAMS[f.name] || {h:'',st:0,desc:''};
  f.hoon = info.h; f.desc = info.desc; f.st = info.st;
  f.members.sort(function(a,b){ return LEVELS.indexOf(a.lv) - LEVELS.indexOf(b.lv); });
  f.total = f.members.length;
});
familyList.sort(function(a,b){ return a.total - b.total || String(a.name).localeCompare(String(b.name)); });

/* =========================================================
   상태
   ========================================================= */
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function todayStr(d){
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function defState(){
  return {
    cur: DATA[0] ? DATA[0].id : null,
    unlockAll: false,
    hide: false,
    bookmarks: [],
    memo: {},
    studied: {},
    today: { date: todayStr(), seen: {}, quiz: { t:0, c:0, mt:0, mc:0, rt:0, rc:0, wrong:[] } },
    goal: 8,
    filters: { cats: [], fam: '', bmOnly: false }
  };
}
var state = defState();
var reveal = {};
var _deck = null;

function load(){
  var raw = null;
  try{ raw = JSON.parse(localStorage.getItem(LS) || 'null'); }catch(e){ raw = null; }
  var d = defState();
  if(raw && typeof raw === 'object'){
    ['cur','unlockAll','hide','bookmarks','memo','studied','goal'].forEach(function(k){
      if(raw[k] !== undefined && raw[k] !== null) d[k] = raw[k];
    });
    if(!Array.isArray(d.bookmarks)) d.bookmarks = [];
    if(!d.memo || typeof d.memo !== 'object') d.memo = {};
    if(!d.studied || typeof d.studied !== 'object') d.studied = {};
    if(raw.filters && typeof raw.filters === 'object'){
      if(Array.isArray(raw.filters.cats)) d.filters.cats = raw.filters.cats.slice();
      if(typeof raw.filters.fam === 'string') d.filters.fam = raw.filters.fam;
      d.filters.bmOnly = !!raw.filters.bmOnly;
    }
    if(raw.today && raw.today.date === todayStr()){
      d.today.date = raw.today.date;
      if(raw.today.seen && typeof raw.today.seen === 'object') d.today.seen = raw.today.seen;
      if(raw.today.quiz && typeof raw.today.quiz === 'object'){
        var q = raw.today.quiz;
        d.today.quiz = {
          t: +q.t || 0, c: +q.c || 0, mt: +q.mt || 0, mc: +q.mc || 0,
          rt: +q.rt || 0, rc: +q.rc || 0,
          wrong: Array.isArray(q.wrong) ? q.wrong.slice() : []
        };
      }
    }
    if(typeof d.goal !== 'number' || d.goal < 1) d.goal = 8;
  }
  if(!byId[d.cur]) d.cur = DATA[0] ? DATA[0].id : null;
  state = d;
  reveal = {};
  _deck = null;
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
}

/* =========================================================
   잠금 · 덱
   ========================================================= */
function isOpen(lv){ return FREE_LEVELS.indexOf(lv) >= 0 || !!state.unlockAll; }
function isBm(c){ return state.bookmarks.indexOf(c.id) >= 0; }
function dirty(){ _deck = null; }

function deck(){
  if(_deck) return _deck;
  var f = state.filters || { cats:[], fam:'', bmOnly:false };
  _deck = DATA.filter(function(c){
    if(!isOpen(c.lv)) return false;
    if(f.cats && f.cats.length && f.cats.indexOf(c.cat) < 0) return false;
    if(f.fam && c.fam !== f.fam) return false;
    if(f.bmOnly && !isBm(c)) return false;
    return true;
  });
  return _deck;
}
function deckIndex(){
  var d = deck();
  for(var i=0;i<d.length;i++){ if(d[i].id === state.cur) return i; }
  return d.length ? 0 : -1;
}
function cur(){
  var d = deck();
  if(!d.length) return null;
  return d[deckIndex()];
}
function show(id){
  if(!byId[id]) return;
  state.cur = id;
  touch(id);
  render();
}
function next(dir){
  var d = deck();
  if(!d.length) return;
  var i = deckIndex(), j = i + (dir || 1);
  if(j >= d.length){
    if(!state.unlockAll){ openPaywall('end'); return; }
    j = 0;
  }
  if(j < 0) j = d.length - 1;
  if(j < 0) j = 0;
  state.cur = d[j].id;
  touch(state.cur);
  render();
}
function touch(id){
  if(!id) return;
  if(!state.today.seen[id]) state.today.seen[id] = 1;
  if(!state.studied[id]) state.studied[id] = todayStr();
  save();
}
function studiedIn(lv){
  var n = 0;
  for(var id in state.studied){ if(byId[id] && byId[id].lv === lv) n++; }
  return n;
}

/* =========================================================
   글자 도우미
   ========================================================= */
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function num(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function dots(n){
  n = Math.max(1, Math.min(30, n || 1));
  var s = ''; for(var i=0;i<n;i++) s += '·';
  return s;
}
function isMasked(key){ return !!state.hide && !reveal[key]; }
function maskCls(key, extra){ return ' ' + (extra || '') + (isMasked(key) ? ' masked' : ''); }
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function pickRand(a){ return a[Math.floor(Math.random()*a.length)]; }
var SPK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* =========================================================
   메인 렌더
   ========================================================= */
function fxHTML(c, hideWhy){
  if(c.pict){
    return '<div class="fx pict' + maskCls('why') + '" data-act="reveal" data-val="why">' +
      '<div class="comp"><b>' + (hideWhy ? dots(3) : esc(c.pict)) + '</b><i>' + (hideWhy ? dots(2) : '그림') + '</i></div>' +
    '</div>';
  }
  var comps = c.comps, n = comps.length, cols = (n === 3 ? 3 : 2);
  var inner = comps.map(function(p, i){
    var plus = (i < n - 1 && (i + 1) % cols !== 0) ? ' plus' : '';
    return '<div class="comp' + plus + '"><b>' + (hideWhy ? dots(1) : esc(p[0])) + '</b><i>' + (hideWhy ? dots(2) : esc(p[1])) + '</i></div>';
  }).join('');
  return '<div class="fx' + (n === 3 ? ' c3' : '') + maskCls('why') + '" data-act="reveal" data-val="why">' + inner + '</div>';
}

function heroHTML(c){
  if(!c){
    return '<div class="empty"><span>조건에 맞는 한자가 없어요</span><button data-act="clearFilter">필터 초기화</button></div>';
  }
  var hideMean = isMasked('mean'), hideWhy = isMasked('why');
  var bm = isBm(c);
  return '' +
  '<section class="card l">' +
    '<button class="star' + (bm ? ' on' : '') + '" data-act="bm" aria-label="북마크">' + (bm ? '★' : '☆') + '</button>' +
    '<div class="hanja' + maskCls('mean') + '" data-act="reveal" data-val="mean">' +
      (hideMean ? dots(c.hoonum.length) : esc(c.hoonum)) + '</div>' +
    '<div class="glyph">' + esc(c.h) + '</div>' +
    '<div class="strokes"><span class="pen">✏️</span><span>총 ' + c.st + '획</span></div>' +
  '</section>' +
  '<section class="card r" data-act="detail">' +
    '<div class="why"><span>왜 이 뜻?</span><button class="more" data-act="detail">자세히 ›</button></div>' +
    '<div class="core">' +
      fxHTML(c, hideWhy) +
      '<div class="res' + maskCls('why') + '" data-act="reveal" data-val="why"><span class="eq">=</span>' +
        (hideWhy ? dots(Math.min(22, c.res.length)) : esc(c.res)) + '</div>' +
    '</div>' +
    '<div class="hint' + maskCls('mean') + '" data-act="reveal" data-val="mean">' +
      '<span class="ck">✓</span><span class="hb"><small>핵심 뜻</small><b>' +
      (hideMean ? dots(c.core.length) : esc(c.core)) + '</b></span>' +
    '</div>' +
  '</section>';
}

function chipHTML(ch, mean, label){
  var k = byHanja[ch];
  if(!k){
    return '<div class="chip static"><b>' + esc(ch) + '</b><i>' + esc(mean || '') + '</i></div>';
  }
  if(isOpen(k.lv)){
    return '<button class="chip" data-act="go" data-val="' + k.id + '"><b>' + esc(ch) + '</b><i>' + esc(k.hoonum) + '</i></button>';
  }
  return '<button class="chip locked" data-act="paywall" data-val="' + k.lv + '">' +
    '<span class="lk">🔒' + k.lv + '</span><b>' + esc(ch) + '</b><i>' + esc(k.hoonum) + '</i></button>';
}
function memberChip(m){
  if(isOpen(m.lv)){
    return '<button class="chip' + (m.id === state.cur ? ' on' : '') + '" data-act="go" data-val="' + m.id + '">' +
      '<b>' + esc(m.h) + '</b><i>' + esc(m.hoonum) + '</i></button>';
  }
  return '<button class="chip locked" data-act="paywall" data-val="' + m.lv + '">' +
    '<span class="lk">🔒' + m.lv + '</span><b>' + esc(m.h) + '</b><i>' + esc(m.hoonum) + '</i></button>';
}

function stripHTML(c){
  if(!c) return '';
  var seen = {}, parts = [];
  c.comps.forEach(function(p){
    if(seen[p[0]]) return;
    seen[p[0]] = 1;
    parts.push(chipHTML(p[0], p[1]));
  });
  if(!parts.length && c.rad) parts.push(chipHTML(c.rad, (FAMS[c.fam] || {}).h || ''));
  var fam = families[c.fam];
  var sibs = [];
  if(fam){
    fam.members.forEach(function(m){
      if(m.id === c.id || sibs.length >= 5) return;
      if(seen[m.h]) return;
      sibs.push(m);
    });
  }
  var sibHTML = sibs.map(memberChip).join('');
  return '' +
    '<div class="strip-h"><span>관련 부수(풀이)</span><button class="info" data-act="radical" aria-label="부수 설명">i</button>' +
      '<span class="strip-more">' + (fam ? '같은 부수 ' + fam.total + '자' : '') + '</span>' +
    '</div>' +
    '<div class="chips">' + parts.join('') +
      (sibHTML ? '<span class="sep"></span>' + sibHTML : '') +
    '</div>';
}

function readRow(kind, label, sub, value, say){
  var masked = isMasked(kind);
  return '' +
  '<div class="rrow">' +
    '<div class="rlab"><b>' + label + '</b><small>' + sub + '</small></div>' +
    (masked
      ? '<div class="rval masked" data-act="reveal" data-val="' + kind + '"><b class="big">?</b></div>'
      : '<div class="rval"><b class="big">' + esc(value) + '</b></div>') +
    '<button class="spk" data-act="say" data-val="' + say + '" aria-label="' + label + ' 듣기">' + SPK_SVG + '</button>' +
  '</div>';
}
function readHTML(c){
  if(!c) return '';
  var ws = c.words.map(function(w){ return w[1]; });
  var line = ws.slice(0, 3).join(' · ') + (ws.length > 3 ? ' 외 ' + (ws.length - 3) : '');
  var wmask = isMasked('mean');
  return readRow('hoon','훈','뜻', c.hoon, 'hoon') +
    readRow('eum','음','소리', c.eum, 'eum') +
    (wmask
      ? '<div class="rrow" data-act="reveal" data-val="mean">' +
          '<div class="rlab"><b style="font-size:11px">한자어</b></div>' +
          '<div class="words masked" style="max-width:150px">' + dots(9) + '</div>' +
          '<span class="wc">' + c.words.length + '개</span>' +
        '</div>'
      : '<button class="rrow" data-act="words">' +
          '<div class="rlab"><b style="font-size:11px">한자어</b></div>' +
          '<div class="words">' + esc(line) + '</div>' +
          '<span class="wc">' + c.words.length + '개 ›</span>' +
        '</button>');
}

function dockHTML(){
  return '' +
  '<button class="btn ghost' + (state.hide ? ' on' : '') + '" data-act="hide">' +
    '<span class="bi">' + (state.hide ? '👁' : '👁️') + '</span><span>' + (state.hide ? '뜻 보기' : '뜻 가리기') + '</span>' +
  '</button>' +
  '<button class="btn primary" data-act="quiz"><span class="bi">🧩</span><span>퀴즈</span></button>' +
  '<button class="btn ghost" data-act="next"><span class="bi">→</span><span>다음</span></button>';
}

function render(){
  var c = cur();
  document.getElementById('hero').innerHTML = heroHTML(c);
  document.getElementById('strip').innerHTML = stripHTML(c);
  document.getElementById('read').innerHTML = readHTML(c);
  document.getElementById('dock').innerHTML = dockHTML();
  var n = Object.keys(state.today.seen).length;
  document.getElementById('todayTxt').textContent = '오늘 ' + n + '/' + state.goal;
  document.getElementById('pFill').style.width = Math.max(2, Math.min(100, (n / state.goal) * 100)) + '%';
  document.getElementById('lvlBtn').textContent = c ? c.lv : '—';
}

/* =========================================================
   시트
   ========================================================= */
function $(id){ return document.getElementById(id); }
function openSheet(html, opts){
  opts = opts || {};
  closePop();
  $('sheetBody').innerHTML = html;
  $('sheet').classList.add('on');

/* ---- 퀴즈 1 · 훈·음 매칭 ---- */
function makeMatchQuiz(){
  var open = DATA.filter(function(c){ return isOpen(c.lv); });
  if(open.length < 6) return null;
  var mode = (_mTurn++ % 2 === 0) ? 'h2m' : 'm2h';
  var t = pickRand(open);
  var pool = open.filter(function(c){ return c.id !== t.id; });
  var seenH = {}, seenM = {};
  seenH[t.h] = 1; seenM[t.hoonum] = 1;
  var picks = [];
  shuffle(pool.filter(function(c){ return c.fam === t.fam; }))
    .concat(shuffle(pool.filter(function(c){ return c.fam !== t.fam; })))
    .forEach(function(c){
      if(picks.length >= 3) return;
      if(seenH[c.h] || seenM[c.hoonum]) return;
      if(c.eum === t.eum) return;
      seenH[c.h] = 1; seenM[c.hoonum] = 1; picks.push(c);
    });
  if(picks.length < 3) return null;
  var opts = [], ans = null;
  shuffle(picks.concat([t])).forEach(function(c,i){
    var k = 'o' + i;
    opts.push({ k:k, c:c });
    if(c === t) ans = k;
  });
  if(!ans) return null;
  return { kind:'match', mode:mode, t:t, opts:opts, ans:ans, picked:null };
}

/* ---- 퀴즈 2 · 부수 파생 ---- */
function buildRadQuiz(mode){
  var hosts = familyList.filter(function(f){
    var open = f.members.filter(function(c){ return isOpen(c.lv); });
    f._open = open;
    return f.total >= 4 && open.length >= (mode === 'not' ? 3 : 1);
  });
  if(hosts.length < 3) return null;
  var host = pickRand(hosts);
  var openHost = host.members.filter(function(c){ return isOpen(c.lv); });
  var used = {}, opts = [];
  used[host.name] = 1;

  function intruders(n){
    var out = [];
    var others = shuffle(familyList.filter(function(f){ return f.name !== host.name; }));
    for(var i=0;i<others.length && out.length<n;i++){
      var cands = shuffle(others[i].members.filter(function(c){
        return isOpen(c.lv) && !used[c.h] && !famHas(c, host.name);
      }));
      for(var j=0;j<cands.length && out.length<n;j++){
        used[cands[j].h] = 1; out.push(cands[j]);
      }
    }
    return out;
  }

  if(mode === 'not'){
    var mem = shuffle(openHost.slice()).slice(0,3);
    if(mem.length < 3) return null;
    mem.forEach(function(c){ used[c.h] = 1; opts.push({ c:c, inFam:true }); });
    var ins = intruders(1);
    if(!ins.length) return null;
    opts.push({ c:ins[0], inFam:false });
  } else {
    var one = shuffle(openHost.slice())[0];
    used[one.h] = 1;
    opts.push({ c:one, inFam:true });
    var ins2 = intruders(3);
    if(ins2.length < 3) return null;
    ins2.forEach(function(c){ opts.push({ c:c, inFam:false }); });
  }

  var ansRef = (mode === 'not') ? opts[3] : opts[0];
  var items = [], ans = null;
  shuffle(opts.slice()).forEach(function(o,i){
    var k = 'o' + i;
    items.push({ k:k, c:o.c, inFam:o.inFam });
    if(o === ansRef) ans = k;
  });
  if(!ans) return null;
  return { kind:'rad', mode:mode, fam:host, opts:items, ans:ans, picked:null };
}
function makeRadQuiz(){
  for(var i=0;i<16;i++){
    var mode = (_rTurn++ % 2 === 0) ? 'not' : 'yes';
    var q = buildRadQuiz(mode);
    if(q) return q;
  }
  return null;
}

        '<div class="l3">' + esc(firstWord(c)) + '</div>' +
      '</div></button>';
  }).join('');
  return '' +
    '<div class="qz-h"><b>부수 파생 퀴즈</b><span>' + quizStatHTML() + '</span></div>' +
    '<div class="qz-body">' +
      '<div class="qz-q">' +
        '<div class="fam"><span class="famk">' + esc(fam.name) + '</span>' +
          '<span class="famc"><b>' + esc(fam.hoon) + '</b>' +
          '<small>' + fam.total + '자 가문 · 지금 ' + fam.members.filter(function(m){ return isOpen(m.lv); }).length + '자 열림</small></span></div>' +
        '<div class="qq">' + qq + '</div>' +
      '</div>' +
      '<div class="kopts' + (done ? ' rved' : '') + '">' + opts + '</div>' +
      quizFeedbackHTML(q, done) +
    '</div>' +
    quizFootHTML(done);
}

/* ---- 탭 3 · 오늘 복습 ---- */
function reviewHTML(){
  var q = state.today.quiz;
  var seenIds = Object.keys(state.today.seen).filter(function(id){ return byId[id]; });
  var wrongIds = q.wrong.filter(function(id){ return byId[id]; });
  var listIds = wrongIds.concat(seenIds.filter(function(id){ return wrongIds.indexOf(id) < 0; }));
  var head = '' +
    '<div class="qz-h"><b>오늘 복습</b><span>정답 ' + q.c + ' / ' + q.t + '</span></div>' +
    '<div class="rv-sum">' +
      '<div><b>' + seenIds.length + '</b><small>오늘 본 한자</small></div>' +
      '<div><b>' + wrongIds.length + '</b><small>틀린 한자</small></div>' +
      '<div><b>' + Object.keys(state.studied).length + '</b><small>누적 학습</small></div>' +
    '</div>';
  if(!listIds.length){
    return head + '<div class="empty"><span>아직 오늘 본 한자가 없어요.<br/>카드를 넘기며 한자를 모아 보세요.</span>' +
      '<button data-act="close">닫고 학습하기</button></div>';
  }
  var items = listIds.slice(0, 10).map(function(id){
    var c = byId[id];
    var isWrong = wrongIds.indexOf(id) >= 0;
    return '<button class="rv-item" data-act="go" data-val="' + c.id + '">' +
      '<span class="rk">' + esc(c.h) + '</span>' +
      '<span class="rt"><span class="rh">' + esc(c.hoonum) + '</span>' +
        '<span class="rs">' + esc(c.lv) + ' · ' + esc(firstWord(c)) + '</span></span>' +
      (isWrong ? '<span class="rv-b">틀림</span>' : '') +
    '</button>';
  }).join('');
  return head + '<div class="rv-list">' + items + '</div>' +
    '<div class="qz-actions" style="margin-top:12px"><button class="btn" data-act="close">닫기</button></div>';
}

function quizTabHTML(){
  var tabs = [
    { k:'match', t:'훈·음 매칭', i:'字' },
    { k:'rad', t:'부수 파생', i:'木' },
    { k:'review', t:'오늘 복습', i:'✓' }
  ];
  return '<div class="qz-tabs">' + tabs.map(function(x){
    return '<button class="qz-tab' + (quizTab === x.k ? ' on' : '') + '" data-act="qtab" data-val="' + x.k + '">' +
      '<span class="tb">' + x.i + '</span>' + x.t + '</button>';
  }).join('') + '</div>';
}
function quizHTML(){
  var head = '<div class="sh-h"><h2>🧩 퀴즈</h2><button class="x" data-act="close" aria-label="닫기">✕</button></div>';
  var body;
  if(quizTab === 'rad') body = radicalQuizHTML();
  else if(quizTab === 'review') body = reviewHTML();
  else body = matchQuizHTML();
  return head + quizTabHTML() + body;
}
function openQuiz(tab){
  quizTab = tab || 'match';
  if(quizTab === 'match') qMatch = makeMatchQuiz();
  else if(quizTab === 'rad') qRad = makeRadQuiz();
  openSheet(quizHTML());
}
function setQuizTab(tab){
  if(tab !== 'match' && tab !== 'rad' && tab !== 'review') return;
  quizTab = tab;
  if(tab === 'match' && !qMatch) qMatch = makeMatchQuiz();
  if(tab === 'rad' && !qRad) qRad = makeRadQuiz();
  openSheet(quizHTML());
}
function newQuestion(){
  if(quizTab === 'match') qMatch = makeMatchQuiz();
  else if(quizTab === 'rad') qRad = makeRadQuiz();
  else return;
  openSheet(quizHTML());
}
function answer(key){
  var q = quizTab === 'rad' ? qRad : (quizTab === 'review' ? null : qMatch);
  if(!q || q.picked) return;
  q.picked = key;
  var ok = key === q.ans;
  var st = state.today.quiz;
  st.t++;
  if(quizTab === 'match'){ st.mt = (st.mt || 0) + 1; } else { st.rt = (st.rt || 0) + 1; }
  if(ok){
    st.c++;
    if(quizTab === 'match') st.mc = (st.mc || 0) + 1;
    else st.rc = (st.rc || 0) + 1;
  } else {
    var missC = q.kind === 'match' ? q.t : (q.mode === 'not' ? (q.opts.filter(function(o){ return o.k === q.ans; })[0] || {c:null}).c : (q.opts.filter(function(o){ return o.k === q.ans; })[0] || {c:null}).c);
    if(missC && st.wrong.indexOf(missC.id) < 0) st.wrong.push(missC.id);
  }
  save();
  openSheet(quizHTML());
}

/* =========================================================
   필터 · 설정
   ========================================================= */
var CATS = [];
DATA.forEach(function(c){ if(CATS.indexOf(c.cat) < 0) CATS.push(c.cat); });

function openFilter(){
  var f = state.filters;
  var catHTML = CATS.map(function(cat){
    var on = f.cats.indexOf(cat) >= 0;
    return '<button class="f-chip' + (on ? ' on' : '') + '" data-act="cat" data-val="' + esc(cat) + '">' + esc(cat) + '</button>';
  }).join('');
  var famSorted = familyList.slice().sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); });
  var opts = '<option value="">모든 부수</option>' + famSorted.map(function(fm){
    return '<option value="' + esc(fm.name) + '"' + (f.fam === fm.name ? ' selected' : '') + '>' +
      esc(fm.name + ' ' + fm.hoon + ' · ' + fm.total + '자') + '</option>';
  }).join('');
  var lvChips = LEVELS.map(function(lv){
    var open = isOpen(lv);
    return '<button class="f-chip' + (open ? ' on' : ' lk') + '" data-act="' + (open ? 'pickLvl' : 'paywall') + '" data-val="' + lv + '">' +
      esc(lv) + '<small>' + num(COUNT[lv]) + '</small>' + (open ? '' : ' 🔒') + '</button>';
  }).join('');
  openSheet('' +
    '<div class="sh-h"><h2>필터</h2><button class="x" data-act="close" aria-label="닫기">✕</button></div>' +
    '<div class="sh-sub">지금 ' + num(deck().length) + '자 · 잠긴 급수 ' + num(PAID_TOTAL) + '자는 평생소장 패스에서 열려요</div>' +
    '<div class="f-block"><h3>급수</h3><div class="f-wrap">' + lvChips + '</div></div>' +
    '<div class="f-block"><h3>뜻 갈래</h3><div class="f-wrap">' + catHTML + '</div></div>' +
    '<div class="f-block"><h3>부수 가문</h3><select class="f-select" id="famSel" data-chg="fam">' + opts + '</select></div>' +
    '<div class="f-block"><h3>보기</h3>' +
      '<div class="f-row"><div class="tx"><b>북마크만 보기</b><small>☆ 표시한 한자만 모아 봐요</small></div>' +
        '<button class="sw' + (f.bmOnly ? ' on' : '') + '" data-act="bmOnly" aria-label="북마크만 보기"></button></div>' +
    '</div>' +
    '<div class="sheet-actions">' +
      '<button class="btn" data-act="clearFilter">초기화</button>' +
      '<button class="btn primary" data-act="close">보기</button>' +
    '</div>'
  );
}
function toggleCat(cat){
  var f = state.filters;
  var i = f.cats.indexOf(cat);
  if(i >= 0) f.cats.splice(i,1); else f.cats.push(cat);
  dirty(); save(); render(); openFilter();
}
function setFam(v){
  state.filters.fam = v || '';
  dirty(); save(); render(); openFilter();
}
function toggleBmOnly(){
  state.filters.bmOnly = !state.filters.bmOnly;
  dirty(); save(); render(); openFilter();
}
function clearFilter(){
  state.filters = { cats:[], fam:'', bmOnly:false };
  dirty(); save(); render(); closeSheet();
}
function toggleBm(){
  var c = cur();
  if(!c) return;
  var i = state.bookmarks.indexOf(c.id);
  if(i >= 0) state.bookmarks.splice(i,1);
  else state.bookmarks.unshift(c.id);
  dirty(); save(); render();
  if($('sheet').classList.contains('on')) openDetail();
  toast(i >= 0 ? '북마크에서 뺐어요' : '★ 북마크에 담았어요');
}

function openSettings(){
  var goalHTML = GOALS.map(function(g){
    return '<button class="f-chip' + (state.goal === g ? ' on' : '') + '" data-act="goal" data-val="' + g + '">' + g + '자</button>';
  }).join('');
  var wordCount = DATA.reduce(function(s,c){ return s + c.words.length; }, 0);
  openSheet('' +
    '<div class="sh-h"><h2>설정</h2><button class="x" data-act="close" aria-label="닫기">✕</button></div>' +
    '<div class="f-block" style="margin-top:2px"><h3>학습</h3>' +
      '<div class="f-row" style="margin-bottom:7px"><div class="tx"><b>하루 목표</b><small>위쪽 진행 바가 채워지는 양</small></div>' +
        '<div class="goal-chips">' + goalHTML + '</div></div>' +
      '<div class="f-row"><div class="tx"><b>테스트용 전체 급수 잠금 해제</b><small>5급·4급·3급 카드도 자유롭게 확인</small></div>' +
        '<button class="sw' + (state.unlockAll ? ' on' : '') + '" data-act="' + (state.unlockAll ? 'lockAll' : 'test') + '" aria-label="전체 급수 해제"></button></div>' +
    '</div>' +
    '<div class="f-block"><h3>데이터</h3>' +
      '<button class="f-chip" data-act="reset" style="width:100%;padding:10px">학습 기록 초기화</button>' +
    '</div>' +
    '<div class="credit">' +
      '<b>한자와이 HanjaWhy</b> · 프로토타입<br/>' +
      '한자 ' + num(DATA.length) + '자 샘플 · 한자어 ' + num(wordCount) + '개 · 부수 ' + familyList.length + '가문<br/>' +
      '훈음·부수·총획: 한국어문회 배정한자 기준 (준급수 포함 · 8~3급 샘플)<br/>' +
      '발음: 기기 음성 합성(ko-KR)<br/>' +
      '© CodeWest' +
    '</div>'
  );
}
function setGoal(g){
  state.goal = +g || 8;
  save(); render(); openSettings();
}
var resetArmed = false;
function resetData(){
  if(!resetArmed){
    resetArmed = true;
    toast('한 번 더 누르면 학습 기록이 지워져요');
    setTimeout(function(){ resetArmed = false; }, 3000);
    return;
  }
  resetArmed = false;
  state = defState();
  reveal = {};
  dirty();
  save();
  closeSheet();
  render();
  toast('학습 기록을 초기화했어요');
}

/* =========================================================
   음성 (Web Speech API · ko-KR)
   ========================================================= */
function speak(text){
  var t = String(text || '').trim();
  if(!t) return;
  if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined'){
    toast('이 브라우저는 음성 재생을 지원하지 않아요');
    return;
  }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    u.lang = 'ko-KR';
    u.rate = 0.92;
    var vs = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
    for(var i=0;i<vs.length;i++){
      var lang = (vs[i].lang || '').toLowerCase();
      if(lang === 'ko-kr' || lang.indexOf('ko') === 0){ u.voice = vs[i]; break; }
    }
    window.speechSynthesis.speak(u);
  }catch(e){ toast('음성을 재생할 수 없어요'); }
}
function sayKey(key){
  var c = cur();
  if(!c) return;
  if(key === 'hoon'){ speak(c.hoon); return; }
  if(key === 'eum'){ speak(c.eum); return; }
  speak(c.hoonum);
}

/* =========================================================
   동작 라우터
   ========================================================= */
function act(name, val){
  switch(name){
    case 'next': next(1); return;
    case 'prev': next(-1); return;
    case 'bm': toggleBm(); return;
    case 'detail': openDetail(); return;
    case 'words': openWords(); return;
    case 'say': sayKey(val); return;
    case 'sayWord': speak(val); return;
    case 'go': show(val); closeSheet(); return;
    case 'paywall': openPaywall(val); return;
    case 'lvl': togglePop(); return;
    case 'pickLvl': pickLevel(val); return;
    case 'filter': closePop(); openFilter(); return;
    case 'settings': closePop(); openSettings(); return;
    case 'quiz': openQuiz('match'); return;
    case 'qtab': setQuizTab(val); return;
    case 'qnew': newQuestion(); return;
    case 'answer': answer(val); return;
    case 'hide':
      state.hide = !state.hide;
      reveal = {};
      save(); render();
      if(state.hide) toast('훈음과 유래를 가렸어요 · ? 를 누르면 하나씩 확인');
      return;
    case 'reveal':
      if(val) reveal[val] = 1;
      render();
      return;
    case 'close': closeSheet(); return;
    case 'test': testUnlock(); return;
    case 'lockAll': lockAll(); return;
    case 'buy': buyDemo(); return;
    case 'goal': setGoal(val); return;
    case 'reset': resetData(); return;
    case 'cat': toggleCat(val); return;
    case 'bmOnly': toggleBmOnly(); return;
    case 'clearFilter': clearFilter(); return;
    case 'radical': openRadical(); return;
    default: return;
  }
}

/* =========================================================
   이벤트
   ========================================================= */
document.addEventListener('click', function(e){
  var t = e.target;
  var el = t && t.closest ? t.closest('[data-act]') : null;
  if(!el) return;
  if(el.disabled) return;
  var name = el.getAttribute('data-act');
  var val = el.getAttribute('data-val');
  e.preventDefault();
  act(name, val);
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(!t || !t.getAttribute) return;
  var chg = t.getAttribute('data-chg');
  if(chg === 'fam') setFam(t.value);
});
document.addEventListener('input', function(e){
  var t = e.target;
  if(t && t.id === 'memo'){
    var id = t.getAttribute('data-id');
    if(id){
      state.memo[id] = t.value;
      save();
      var s = document.getElementById('memoState');
      if(s){ s.textContent = '저장됨'; s.classList.add('on'); }
    }
  }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ closeSheet(); closePop(); return; }
  if(!$('sheet').classList.contains('on') && !$('pop').classList.contains('on')){
    if(e.key === 'ArrowRight') act('next');
    if(e.key === 'ArrowLeft') act('prev');
    if(e.key === ' '){ e.preventDefault(); act('hide'); }
    if(e.key === 'Enter') act('quiz');
  }
});
(function(){
  var h = $('hero'), tx = 0, ty = 0, moved = false;
  h.addEventListener('touchstart', function(e){
    if(!e.touches || !e.touches.length) return;
    tx = e.touches[0].clientX; ty = e.touches[0].clientY; moved = false;
  }, { passive:true });
  h.addEventListener('touchmove', function(e){
    if(!e.touches || !e.touches.length) return;
    var dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
    if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) moved = true;
  }, { passive:true });
  h.addEventListener('touchend', function(e){
    if(!moved || !e.changedTouches || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.3){ next(dx < 0 ? 1 : -1); }
    moved = false;
  }, { passive:true });
})();
document.addEventListener('click', function(e){
  var p = $('pop');
  if(!p.classList.contains('on')) return;
  var t = e.target;
  if(t && t.closest && t.closest('#pop')) return;
  if(t && t.closest && t.closest('[data-act="lvl"]')) return;
  closePop();
});

/* =========================================================
   시작
   ========================================================= */
load();
if(!cur()) state.cur = DATA[0] ? DATA[0].id : null;
touch(state.cur);
render();

/* 테스트 · 검증용 훅 */
window.__HJ = {
  DATA: DATA, byId: byId, byHanja: byHanja, families: families, familyList: familyList,
  COUNT: COUNT, LEVELS: LEVELS, FAMS: FAMS,
  getState: function(){ return state; },
  setState: function(patch){ for(var k in patch) state[k] = patch[k]; dirty(); },
  deck: deck, cur: cur, act: act, render: render,
  heroHTML: heroHTML, stripHTML: stripHTML, readHTML: readHTML,
  sheetHTML: function(){ return $('sheetBody').innerHTML; },
  isOpen: isOpen, openQuiz: openQuiz, quizHTML: quizHTML, quizTab: function(){ return quizTab; },
  setQuizTab: setQuizTab, answer: answer, newQuestion: newQuestion,
  makeMatchQuiz: makeMatchQuiz, makeRadQuiz: makeRadQuiz, buildRadQuiz: buildRadQuiz,
  openPaywall: openPaywall, openDetail: openDetail, openWords: openWords, openRadical: openRadical,
  openFilter: openFilter, openSettings: openSettings, closeSheet: closeSheet,
  toast: function(m){ toast(m); }
};
})();
